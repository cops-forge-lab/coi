  <style>
/* =========================================================
   COI Forge — estilos
   ========================================================= */
:root {
  --accent: #6d28d9;
  --accent-soft: color-mix(in srgb, var(--accent) 14%, transparent);
  --bg: #f2f4f8;
  --surface: #ffffff;
  --surface-2: #f7f8fb;
  --text: #121a2b;
  --muted: #64708a;
  --border: #e1e6ef;
  --sidebar: #0d1320;
  --sidebar-text: #a9b4c6;
  --good: #0f9f6e;
  --warn: #d98a05;
  --bad: #dc3545;
  --info: #3b82f6;
  --radius: 12px;
  --shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 4px 14px rgba(16, 24, 40, .05);
  --row: 88px;
  --gap: 14px;
  color-scheme: light;
}
[data-theme="dark"] {
  --bg: #090e18;
  --surface: #111827;
  --surface-2: #0d1422;
  --text: #e8edf6;
  --muted: #8d9ab0;
  --border: #1f2a3d;
  --sidebar: #070b13;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 14px/1.45 "Segoe UI", Inter, system-ui, -apple-system, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.muted { color: var(--muted); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
code { background: var(--surface-2); border: 1px solid var(--border); border-radius: 5px; padding: 1px 5px; font-size: 12px; }

/* ---------- layout ---------- */
.app { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100vh; }
.sidebar {
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
  background: var(--sidebar); color: #fff; padding: 20px 14px;
  display: flex; flex-direction: column; gap: 18px; z-index: 30;
}
.brand { display: flex; gap: 11px; align-items: center; padding: 0 6px; }
.brand-mark { width: 38px; height: 38px; border-radius: 10px; background: var(--accent); display: grid; place-items: center; flex: none; }
.brand-mark svg { width: 20px; fill: #fff; }
.brand strong { display: block; font-size: 16px; letter-spacing: .2px; }
.brand small { display: block; color: var(--sidebar-text); font-size: 11.5px; line-height: 1.3; }

.nav, .page-list { display: flex; flex-direction: column; gap: 2px; }
.nav button, .page-list button {
  display: flex; align-items: center; gap: 10px; width: 100%;
  background: none; border: 0; color: var(--sidebar-text);
  padding: 10px 12px; border-radius: 8px; cursor: pointer; text-align: left;
}
.nav button:hover, .page-list button:hover { background: #ffffff10; color: #fff; }
.nav button.active { background: var(--accent); color: #fff; }
.page-list button.active { background: #ffffff14; color: #fff; }
.page-list small { margin-left: auto; font-size: 11px; background: #ffffff14; padding: 1px 7px; border-radius: 99px; }
.ico { width: 18px; text-align: center; opacity: .9; }
.nav-label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: #5f6b80; padding: 0 12px 6px; }
.sidebar-foot { margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 6px; color: #5f6b80; font-size: 11px; }
.live { display: flex; align-items: center; gap: 8px; background: #ffffff0d; border: 1px solid #ffffff14; color: #cfd7e4; border-radius: 99px; padding: 6px 11px; cursor: pointer; font-size: 12px; }
.pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 0 var(--good); animation: pulse 2s infinite; }
.live.off .pulse { background: #6b7280; animation: none; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(15, 159, 110, .6); } 70% { box-shadow: 0 0 0 7px rgba(15, 159, 110, 0); } 100% { box-shadow: 0 0 0 0 rgba(15, 159, 110, 0); } }

.shell { min-width: 0; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 14px;
  min-height: 70px; padding: 10px 26px;
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
}
.topbar-title { min-width: 0; flex: 1; }
.topbar-title h1 { font-size: 19px; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar-title p { margin: 0; color: var(--muted); font-size: 12.5px; }
.topbar-actions { display: flex; align-items: center; gap: 8px; }
.clock { color: var(--muted); font-size: 12.5px; margin-right: 6px; white-space: nowrap; }
.icon-btn.menu-btn { display: none; }
.view { padding: 22px 26px 40px; outline: none; max-width: 1680px; width: 100%; margin: 0 auto; }

/* ---------- buttons / fields ---------- */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--border); background: var(--surface); color: var(--text);
  padding: 8px 13px; border-radius: 8px; cursor: pointer; white-space: nowrap; font-weight: 500;
}
.btn:hover { border-color: color-mix(in srgb, var(--accent) 50%, var(--border)); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(1.1); }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.icon-btn {
  width: 36px; height: 36px; display: inline-grid; place-items: center;
  border: 1px solid var(--border); background: var(--surface); color: var(--text);
  border-radius: 8px; cursor: pointer; font-size: 15px;
}
.icon-btn.sm { width: 28px; height: 28px; font-size: 12px; }
.icon-btn:hover { border-color: var(--accent); }
.icon-btn svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; }

.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; font-weight: 600; font-size: 12.5px; }
.field input:not([type="range"]):not([type="color"]), .field select, .field textarea,
.data-table input, .data-table select, .field-inline select {
  width: 100%; padding: 9px 10px; border: 1px solid var(--border); border-radius: 8px;
  background: var(--surface-2); font-weight: 400;
}
.field textarea { resize: vertical; font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; }
.field input[type="color"] { width: 64px; height: 36px; border: 1px solid var(--border); border-radius: 8px; padding: 2px; background: var(--surface-2); }
.field input[type="range"] { accent-color: var(--accent); }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.check { display: flex; align-items: center; gap: 8px; margin: 6px 0 14px; cursor: pointer; }
.check input { accent-color: var(--accent); width: 16px; height: 16px; }

/* ---------- chips / status ---------- */
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 99px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.chip.good { background: color-mix(in srgb, var(--good) 14%, transparent); color: var(--good); }
.chip.warn { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }
.chip.bad  { background: color-mix(in srgb, var(--bad) 14%, transparent);  color: var(--bad); }
.chip.info { background: color-mix(in srgb, var(--info) 14%, transparent); color: var(--info); }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.good { background: var(--good); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); }
.good { color: var(--good); } .warn { color: var(--warn); } .bad { color: var(--bad); }

/* ---------- tabs / editbar ---------- */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 18px; overflow-x: auto; }
.tab { background: none; border: 0; padding: 10px 14px; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; font-weight: 600; }
.tab.active { color: var(--text); border-color: var(--accent); }
.editbar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
  padding: 12px; margin-bottom: 16px; border-radius: var(--radius);
  border: 1px dashed color-mix(in srgb, var(--accent) 55%, transparent); background: var(--accent-soft);
}
.hint { color: var(--muted); font-size: 12px; margin-left: auto; }

/* ---------- grid / widgets ---------- */
.grid {
  display: grid; grid-template-columns: repeat(12, minmax(0, 1fr));
  grid-auto-rows: var(--row); grid-auto-flow: row dense; gap: var(--gap);
}
.widget {
  grid-column: span var(--w); grid-row: span var(--h);
  position: relative; min-width: 0; min-height: 0;
  display: flex; flex-direction: column;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 14px 16px; overflow: hidden;
  transition: box-shadow .15s, border-color .15s, opacity .15s;
}
.w-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; min-height: 22px; }
.w-head h3 { margin: 0; font-size: 13px; font-weight: 600; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
.w-body { flex: 1; min-height: 0; position: relative; }
.w-tools { display: flex; gap: 4px; }
.w-tools button { width: 26px; height: 26px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface-2); cursor: pointer; font-size: 12px; display: grid; place-items: center; }
.w-tools button:hover { border-color: var(--accent); color: var(--accent); }
.drag-handle { cursor: grab; color: var(--muted); }

body.editing .view > .grid .widget { border-style: dashed; border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); cursor: grab; }
body.editing .view > .grid .w-body { pointer-events: none; user-select: none; }
.widget.dragging { opacity: .4; }
.widget.drop-before { box-shadow: -4px 0 0 0 var(--accent); }
.widget.drop-after { box-shadow: 4px 0 0 0 var(--accent); }
.resize-handle {
  position: absolute; right: 3px; bottom: 3px; width: 18px; height: 18px; cursor: nwse-resize; touch-action: none;
  background: linear-gradient(135deg, transparent 50%, var(--accent) 50%, var(--accent) 60%, transparent 60%, transparent 70%, var(--accent) 70%, var(--accent) 80%, transparent 80%);
  border-radius: 0 0 8px 0; opacity: .8;
}
.widget.resizing { border-color: var(--accent); z-index: 2; }
.widget.resizing::after { content: attr(data-size); position: absolute; right: 26px; bottom: 6px; background: var(--accent); color: #fff; font-size: 11px; padding: 2px 7px; border-radius: 6px; }

.empty, .empty-page { color: var(--muted); display: grid; place-items: center; text-align: center; height: 100%; font-size: 12.5px; padding: 10px; }
.empty-page { background: var(--surface); border: 1px dashed var(--border); border-radius: var(--radius); padding: 60px 20px; gap: 6px; }
.empty-page p { margin: 0 0 10px; }

/* KPI */
.kpi { display: flex; flex-direction: column; justify-content: center; height: 100%; gap: 8px; }
.kpi-value { font-size: clamp(24px, 2.4vw, 34px); font-weight: 700; letter-spacing: -.5px; color: var(--text); line-height: 1.05; }
.kpi-value .unit { font-size: .5em; font-weight: 600; color: var(--muted); margin-left: 2px; }
.kpi-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 12px; }

/* line chart */
.chart { display: flex; flex-direction: column; height: 100%; }
.chart-head { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.chart-head strong { font-size: 22px; }
.chart-head .unit { font-size: 12px; color: var(--muted); font-weight: 500; }
.legend-target { font-size: 12px; margin-left: auto; }
.line-svg { flex: 1; width: 100%; min-height: 0; overflow: visible; }
.line-path { fill: none; stroke: var(--accent); stroke-width: 2.4; stroke-linejoin: round; stroke-linecap: round; }
.target-line { stroke: var(--warn); stroke-width: 1.4; stroke-dasharray: 5 4; }

/* bars */
.bars { display: flex; flex-direction: column; justify-content: space-around; height: 100%; gap: 6px; }
.bar-row { display: grid; grid-template-columns: minmax(70px, 30%) 1fr auto; align-items: center; gap: 10px; font-size: 12.5px; }
.bar-label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
.bar-track { height: 10px; background: var(--surface-2); border-radius: 99px; overflow: hidden; border: 1px solid var(--border); }
.bar-fill { display: block; height: 100%; background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 65%, #fff), var(--accent)); border-radius: 99px; transition: width .6s ease; }
.bar-val { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }

/* gauge */
.gauge { position: relative; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.gauge svg { width: 100%; max-width: 260px; max-height: calc(100% - 22px); }
.gauge-bg, .gauge-fg { fill: none; stroke-width: 16; stroke-linecap: round; }
.gauge-bg { stroke: var(--surface-2); stroke: color-mix(in srgb, var(--muted) 18%, transparent); }
.gauge-fg { stroke: var(--good); transition: stroke-dasharray .6s ease; }
.gauge-fg.warn { stroke: var(--warn); } .gauge-fg.bad { stroke: var(--bad); }
.gauge-target { stroke: var(--text); stroke-width: 3; stroke-linecap: round; }
.gauge-value { margin-top: -38px; display: flex; align-items: baseline; gap: 2px; }
.gauge-value strong { font-size: 28px; }
.gauge-value span { color: var(--muted); font-weight: 600; }
.gauge-meta { font-size: 12px; }

/* alarms */
.alarm-list, .status-list { list-style: none; margin: 0; padding: 0; overflow-y: auto; height: 100%; }
.alarm { display: grid; grid-template-columns: 4px 1fr auto auto; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 12.5px; }
.alarm:last-child { border-bottom: 0; }
.alarm .sev { width: 4px; height: 26px; border-radius: 4px; background: var(--info); }
.alarm.lvl-bad .sev { background: var(--bad); } .alarm.lvl-warn .sev { background: var(--warn); }
.alarm-text { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.alarm time { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; }

/* status */
.status-sum { margin-bottom: 6px; } .status-sum strong { font-size: 20px; }
.status-list { height: calc(100% - 34px); }
.status-list li { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 12.5px; }
.status-list li:last-child { border-bottom: 0; }
.status-list .chip { margin-left: auto; }

/* table */
.table-wrap { overflow: auto; height: 100%; }
.table-wrap table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.table-wrap th { text-align: left; color: var(--muted); font-weight: 600; font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; padding: 8px 10px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--surface); }
.table-wrap td { padding: 8px 10px; border-bottom: 1px solid var(--border); }
.table-wrap tr:last-child td { border-bottom: 0; }

/* text */
.text-body { overflow-y: auto; height: 100%; font-size: 13.5px; }
.text-body p { margin: 0 0 8px; }

/* clock */
.clock-widget { height: 100%; display: flex; flex-direction: column; justify-content: center; gap: 4px; }
.clock-time { font-size: clamp(28px, 3vw, 44px); font-variant-numeric: tabular-nums; letter-spacing: -.5px; }
.clock-date { text-transform: capitalize; font-size: 12.5px; }

/* camera */
.t-camera { padding: 10px; }
.camera { position: relative; height: 100%; border-radius: 8px; overflow: hidden; background: #05080e; color: #e5e7eb; font-family: ui-monospace, Consolas, monospace; font-size: 11px; }
.camera img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cam-noise { position: absolute; inset: 0; background:
  repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0 1px, transparent 1px 3px),
  radial-gradient(ellipse at center, #1c2536 0%, #05080e 75%); }
.cam-nosignal { position: absolute; inset: 0; display: grid; place-items: center; color: #6b7280; letter-spacing: .12em; text-transform: uppercase; }
.cam-rec { position: absolute; top: 8px; left: 10px; display: flex; align-items: center; gap: 5px; color: #f87171; font-weight: 700; }
.cam-rec i { width: 7px; height: 7px; border-radius: 50%; background: #ef4444; animation: blink 1.4s infinite; }
.cam-info { position: absolute; left: 10px; bottom: 8px; background: #00000080; padding: 2px 6px; border-radius: 4px; }
.cam-time { position: absolute; right: 10px; top: 8px; }
@keyframes blink { 50% { opacity: .2; } }

/* embed */
.embed { width: 100%; height: 100%; border: 0; border-radius: 8px; background: var(--surface-2); }

/* ---------- cards / sections ---------- */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; }
.card h2, .block-title { font-size: 15px; margin: 0 0 14px; }
.block-title { margin: 24px 0 12px; }
.summary { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--gap); margin-bottom: var(--gap); }
.stat { display: flex; flex-direction: column; gap: 6px; }
.stat strong { font-size: 26px; }
.section-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 14px; }
.section-head h2 { margin: 0; }
.legend { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.legend .dot { margin-left: 8px; }

/* architecture */
.layers { display: flex; flex-direction: column; gap: 8px; }
.layer { display: grid; grid-template-columns: 130px 1fr; align-items: center; gap: 14px; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--border); position: relative; }
.layer + .layer::before { content: ""; position: absolute; left: 64px; top: -9px; width: 2px; height: 8px; background: var(--border); }
.layer-name { font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.layer-items { display: flex; flex-wrap: wrap; gap: 8px; }
.node { padding: 6px 11px; border-radius: 8px; background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--muted); font-size: 12.5px; }
.node.good { border-left-color: var(--good); color: var(--text); }
.node.warn { border-left-color: var(--warn); color: var(--text); }
.node.bad  { border-left-color: var(--bad);  color: var(--text); }

/* data table */
.table-wrap.card { padding: 0; height: auto; }
.data-table th { background: var(--surface); }
.data-table td { vertical-align: middle; }
.data-table input, .data-table select { padding: 6px 8px; min-width: 90px; }
.data-table input[type="number"] { width: 80px; min-width: 70px; }
.table-foot { padding: 12px 14px; border-top: 1px solid var(--border); font-size: 12px; }

/* settings */
.settings { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: var(--gap); align-items: start; }

/* ---------- videowall ---------- */
.wall-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; margin-bottom: var(--gap); padding: 12px 16px; }
.field-inline { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; }
.field-inline label:not(.check) { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 12.5px; }
.field-inline select { width: auto; padding: 6px 8px; }
.field-inline .check { margin: 0; }
.wall-meta { font-size: 12px; margin-left: auto; }
.wall-frame { background: #05070c; border-radius: 14px; padding: 14px; border: 1px solid #1c2433; }
.wall {
  display: grid; gap: 6px;
  grid-template-columns: repeat(var(--cols), minmax(0, 1fr));
  aspect-ratio: calc(var(--cols) * 16) / calc(var(--rows) * 9);
  max-height: calc(100vh - 220px); margin: 0 auto;
}
.tile { position: relative; background: #0b111c; border: 2px solid #1b2232; border-radius: 4px; overflow: hidden; min-width: 0; min-height: 0; }
.tile-screen { position: absolute; inset: 0; overflow: hidden; }
.tile-label { position: absolute; top: 6px; left: 6px; z-index: 3; font-size: 10.5px; color: #cbd5e1; background: #000000a6; padding: 2px 7px; border-radius: 4px; max-width: calc(100% - 12px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile-label b { color: #fff; margin-right: 4px; }
.tile-select { position: absolute; bottom: 6px; left: 6px; right: 6px; z-index: 3; opacity: 0; transition: opacity .15s; }
.tile:hover .tile-select, .tile:focus-within .tile-select, body.editing .tile-select { opacity: 1; }
.tile-select select { width: 100%; font-size: 11.5px; padding: 4px 6px; border-radius: 6px; border: 1px solid #334155; background: #0f172ae6; color: #e2e8f0; }
.stage { position: absolute; top: 0; left: 0; transform-origin: 0 0; background: var(--bg); }
.stage-page { width: 1600px; padding: 20px; }
.stage-widget { width: 640px; height: 360px; padding: 0; }
.stage-widget .widget { height: 100%; border-radius: 0; border: 0; padding: 16px 18px; }
.wall.labeled .stage-widget .w-head { visibility: hidden; }
.no-signal { position: absolute; inset: 0; display: grid; place-items: center; color: #475569; font: 600 12px ui-monospace, Consolas, monospace; letter-spacing: .2em;
  background: repeating-linear-gradient(45deg, #0b111c 0 10px, #0e1522 10px 20px); }
.wall-frame:fullscreen { padding: 0; border: 0; border-radius: 0; display: grid; place-items: center; background: #000; }
.wall-frame:fullscreen .wall { width: 100vw; max-height: 100vh; gap: 4px; }
.wall-frame:fullscreen .tile-select { display: none; }

/* ---------- drawer / toast ---------- */
.scrim { position: fixed; inset: 0; background: rgba(5, 8, 15, .45); z-index: 40; }
.drawer {
  position: fixed; top: 0; right: 0; height: 100%; width: min(400px, 100%); z-index: 50;
  background: var(--surface); border-left: 1px solid var(--border); box-shadow: -18px 0 40px rgba(0, 0, 0, .18);
  display: flex; flex-direction: column; transform: translateX(105%); transition: transform .22s ease; visibility: hidden;
}
.drawer.open { transform: none; visibility: visible; }
.drawer-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 18px 20px; border-bottom: 1px solid var(--border); }
.drawer-head strong { display: block; font-size: 15px; }
.drawer-head small { color: var(--muted); }
.drawer-form, .lib { flex: 1; overflow-y: auto; padding: 18px 20px; }
.drawer-form hr { border: 0; border-top: 1px solid var(--border); margin: 4px 0 16px; }
.drawer-foot { display: flex; justify-content: space-between; padding: 14px 20px; border-top: 1px solid var(--border); }
.lib { display: grid; gap: 8px; align-content: start; }
.lib-item { display: flex; gap: 12px; align-items: center; text-align: left; padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface-2); cursor: pointer; }
.lib-item:hover { border-color: var(--accent); background: var(--accent-soft); }
.lib-item strong { display: block; font-size: 13.5px; }
.lib-item small { color: var(--muted); font-size: 12px; }
.lib-ico { width: 38px; height: 38px; border-radius: 9px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); font-size: 17px; flex: none; }

.toast {
  position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 20px); z-index: 60;
  background: #111827; color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 13px;
  opacity: 0; pointer-events: none; transition: .2s; box-shadow: 0 10px 30px rgba(0, 0, 0, .25);
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast.good { background: #065f46; } .toast.bad { background: #991b1b; }

/* ---------- modo apresentação ---------- */
body.presenting .sidebar, body.presenting .topbar-actions .btn, body.presenting .icon-btn.menu-btn { display: none; }
body.presenting .app { grid-template-columns: 1fr; }
body.presenting .view { max-width: none; }

/* =========================================================
   v0.3 — fontes de dados e indicadores ao vivo
   ========================================================= */
[hidden] { display: none !important; }

.w-src {
  display: inline-flex; align-items: center; gap: 5px; flex: none; max-width: 60%;
  font-size: 10.5px; font-weight: 600; padding: 2px 8px; border-radius: 99px;
  background: var(--surface-2); color: var(--muted); white-space: nowrap;
}
.w-src::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }
.w-src .t { overflow: hidden; text-overflow: ellipsis; }
.w-src.good { color: var(--good); background: color-mix(in srgb, var(--good) 13%, transparent); }
.w-src.good::before { animation: blink 2s infinite; }
.w-src.warn { color: var(--warn); background: color-mix(in srgb, var(--warn) 15%, transparent); }
.w-src.bad  { color: var(--bad);  background: color-mix(in srgb, var(--bad) 13%, transparent); }
.w-src.static::before { animation: none; }
body.editing .view > .grid .w-src .t { display: none; }
body.editing .view > .grid .w-src { padding: 4px; }
.widget.is-stale { border-color: color-mix(in srgb, var(--warn) 55%, var(--border)); }
.widget.is-stale .w-body { opacity: .5; filter: grayscale(.7); transition: opacity .3s; }

.src-pill {
  display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 12px;
  border: 1px solid var(--border); background: var(--surface); color: var(--text);
  border-radius: 8px; cursor: pointer; font-size: 12.5px; font-weight: 600; white-space: nowrap;
}
.src-pill:hover { border-color: var(--accent); }
.dot.muted { background: var(--muted); }
.dot.info { background: var(--info); }

.block-head { margin: 22px 0 12px; }
.block-head h2 { font-size: 15px; margin: 0; }
.src-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(360px, 100%), 1fr)); gap: var(--gap); }
.src-card { display: flex; flex-direction: column; gap: 14px; }
.src-top { display: flex; align-items: center; gap: 12px; min-width: 0; }
.src-name { min-width: 0; flex: 1; }
.src-name strong { display: block; font-size: 14px; }
.src-name small { display: block; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.src-status .chip { font-size: 12px; padding: 4px 10px; }
.src-status .chip .dot { width: 7px; height: 7px; }
.src-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 16px; margin: 10px 0 0; }
.src-meta div { min-width: 0; }
.src-meta dt { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.src-meta dd { margin: 2px 0 0; font-weight: 600; font-variant-numeric: tabular-nums; }
.src-error { margin: 10px 0 0; font-size: 12px; color: var(--bad); background: color-mix(in srgb, var(--bad) 9%, transparent); border-radius: 8px; padding: 8px 10px; overflow-wrap: anywhere; }
.src-bound { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
.src-card .btn-row { margin-top: auto; flex-wrap: nowrap; gap: 6px; }
.src-card .btn-row .btn { padding: 6px 10px; font-size: 12.5px; }
.src-card .btn-row .danger { margin-left: auto; }
@media (max-width: 420px) { .src-card .btn-row { flex-wrap: wrap; } }

.switch { position: relative; display: inline-flex; cursor: pointer; flex: none; }
.switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.switch-ui { width: 38px; height: 22px; border-radius: 99px; background: color-mix(in srgb, var(--muted) 35%, transparent); position: relative; transition: background .15s; }
.switch-ui::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.3); }
.switch input:checked + .sr-only + .switch-ui { background: var(--good); }
.switch input:checked + .sr-only + .switch-ui::after { transform: translateX(16px); }
.switch input:focus-visible + .sr-only + .switch-ui { outline: 2px solid var(--accent); outline-offset: 2px; }

.how { margin-top: var(--gap); }
.how ol { margin: 0 0 10px; padding-left: 20px; display: grid; gap: 8px; }

.group-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 0 0 12px; }
.hint-text { font-weight: 400; font-size: 11.5px; line-height: 1.4; }
.bind-preview { font-size: 12px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 10px; margin-bottom: 14px; overflow-wrap: anywhere; line-height: 1.6; }
.form-msg { font-size: 12.5px; min-height: 18px; margin: 4px 0 0; overflow-wrap: anywhere; }
.form-msg.good { color: var(--good); } .form-msg.bad { color: var(--bad); }
.paths { max-height: 260px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 16px; height: auto; }
.paths td:first-child { white-space: nowrap; }
pre.json { margin: 0; max-height: 45vh; overflow: auto; font: 11.5px/1.5 ui-monospace, Consolas, monospace; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 12px; white-space: pre; }

@media (max-width: 600px) {
  .src-pill { padding: 0 10px; }
  .src-pill .t { display: none; }
  #fullBtn { display: none; }
  .src-meta { grid-template-columns: 1fr; }
}

/* ---------- responsivo ---------- */
@media (max-width: 1100px) {
  .view > .grid .widget.size-s { grid-column: span 6; }

  .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .clock { display: none; }
}
@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; }
  .sidebar { position: fixed; left: 0; top: 0; width: 270px; transform: translateX(-100%); transition: transform .22s; z-index: 45; }
  .sidebar.open { transform: none; }
  .icon-btn.menu-btn { display: inline-grid; }
  .topbar { padding: 10px 14px; }
  .view { padding: 16px 14px 32px; }
  .hint { margin-left: 0; width: 100%; }
  .resize-handle { display: none; }
}
@media (max-width: 600px) {

  .view > .grid { grid-auto-rows: 80px; }
  .summary { grid-template-columns: 1fr 1fr; }
  .topbar-title p { display: none; }
  #editBtn { padding: 8px 10px; font-size: 12.5px; }
  .layer { grid-template-columns: 1fr; gap: 8px; }
  .layer + .layer::before { display: none; }
  .wall-meta { margin-left: 0; }
  .field-row { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
@media print {
  .sidebar, .topbar-actions, .editbar, .tabs { display: none !important; }
  .app { display: block; }
  .widget, .card { box-shadow: none; break-inside: avoid; }
}

  <script>
"use strict";
/*!
 * COI Forge v0.3.0 — plataforma web para Centros de Operações Integradas
 * Arquivo único: estrutura, estilos, configuração padrão e aplicação.
 * Licença MIT.
 */
/* ==========================================================
   Configuração padrão (JSON em #coi-defaults)
   ========================================================== */
window.COI_DEFAULTS = JSON.parse(document.getElementById("coi-defaults").textContent);

/* ==========================================================
   Store — persistência, migração e utilitários
   ========================================================== */
const U = {
  esc(value) {
    return String(value ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  },
  num(value, fallback = 0) {
    const n = parseFloat(String(value ?? "").replace(",", "."));
    return Number.isFinite(n) ? n : fallback;
  },
  clamp(v, min, max) { return Math.min(max, Math.max(min, v)); },
  list(text) {
    return String(text || "").split(",").map(x => U.num(x, NaN)).filter(Number.isFinite);
  },
  labels(text) {
    return String(text || "").split(",").map(x => x.trim()).filter(Boolean);
  },
  lines(text) {
    return String(text || "").split("\n").map(l => l.trim()).filter(Boolean);
  },
  fmt(n, decimals = 0) {
    return Number(n).toLocaleString("pt-BR", { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
  },
  ago(ms) {
    const s = Math.max(0, Math.round(ms / 1000));
    if (s < 60) return `${s} s`;
    const m = Math.floor(s / 60);
    if (m < 60) return `${m} min`;
    const h = Math.floor(m / 60);
    if (h < 48) return `${h} h`;
    return `${Math.floor(h / 24)} dias`;
  },
  uid(prefix = "w") {
    return prefix + "-" + Math.random().toString(36).slice(2, 8);
  },
  clone(o) { return JSON.parse(JSON.stringify(o)); },
  isHttps(url) { return /^https:\/\/[^\s"'<>]+$/i.test(String(url || "").trim()); }
};

const Store = (() => {
  const KEY = "coi-forge:state:v3";
  const LEGACY = ["coi-forge:state:v2"];
  const SOURCE_TYPES = ["simulated", "rest", "websocket"];

  function valid(s) {
    return !!s && (s.version === 2 || s.version === 3) && Array.isArray(s.pages) && s.pages.length > 0 &&
      s.pages.every(p => p && typeof p.id === "string" && Array.isArray(p.widgets));
  }

  function source(x) {
    return {
      id: String(x.id).slice(0, 40),
      name: String(x.name || "Fonte").slice(0, 40),
      type: SOURCE_TYPES.includes(x.type) ? x.type : "rest",
      url: String(x.url || "").trim().slice(0, 500),
      interval: U.clamp(Math.round(U.num(x.interval, 5)), 1, 3600),
      staleAfter: U.clamp(Math.round(U.num(x.staleAfter, 0)), 0, 86400),
      enabled: x.enabled !== false
    };
  }

  function normalize(s) {
    const defaults = window.COI_DEFAULTS;
    const out = Object.assign(U.clone(defaults), s);
    out.version = 3;
    out.settings = Object.assign(U.clone(defaults.settings), s.settings || {});
    out.videowall = Object.assign(U.clone(defaults.videowall), s.videowall || {});
    if (!Array.isArray(out.architecture)) out.architecture = [];
    if (!Array.isArray(out.assets)) out.assets = [];
    // v2 → v3: configurações antigas recebem as fontes padrão, sem vínculos
    out.sources = Array.isArray(s.sources)
      ? s.sources.filter(x => x && typeof x.id === "string").map(source)
      : U.clone(defaults.sources);
    // v0.3 (estrutura antiga): a fonte "Arquivo de exemplo" lia data/sample-live.json,
    // que não existe mais; os widgets dela passam para o Simulador.
    const legacy = out.sources.filter(x => x.url === "data/sample-live.json").map(x => x.id);
    if (legacy.length) {
      out.sources = out.sources.filter(x => !legacy.includes(x.id));
      if (!out.sources.some(x => x.id === "sim")) out.sources.unshift(U.clone(defaults.sources[0]));
      out.pages.forEach(p => p.widgets.forEach(w => { if (w.binding && legacy.includes(w.binding.source)) w.binding.source = "sim"; }));
    }
    const ids = new Set(out.sources.map(x => x.id));
    out.pages.forEach(p => p.widgets.forEach(w => {
      if (w.binding && typeof w.binding.source === "string" && ids.has(w.binding.source)) {
        w.binding = { source: w.binding.source, path: String(w.binding.path || "").slice(0, 200) };
      } else delete w.binding;
    }));
    if (!out.pages.some(p => p.id === out.activePage)) out.activePage = out.pages[0].id;
    return out;
  }

  function load() {
    for (const key of [KEY, ...LEGACY]) {
      try {
        const saved = JSON.parse(localStorage.getItem(key));
        if (valid(saved)) return normalize(saved);
      } catch (e) { /* estado inválido: tenta o próximo */ }
    }
    return U.clone(window.COI_DEFAULTS);
  }

  function save(state) {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* armazenamento indisponível */ }
  }

  function reset() {
    try { [KEY, ...LEGACY].forEach(k => localStorage.removeItem(k)); } catch (e) { /* noop */ }
    return U.clone(window.COI_DEFAULTS);
  }

  return { load, save, reset, valid, normalize, source, SOURCE_TYPES };
})();

/* ==========================================================
   DataHub — fontes de dados (REST, WebSocket, simulador)
   ========================================================== */
const DataHub = (() => {
  const TYPES = {
    simulated: { label: "Simulador", icon: "◇" },
    rest:      { label: "REST (polling)", icon: "⇅" },
    websocket: { label: "WebSocket", icon: "⇄" }
  };
  const TIMEOUT = 8000;
  const runtime = {};
  const sims = {};
  const listeners = new Set();
  let paused = false;

  /* ---------- utilitários ---------- */
  function urlCheck(url, type) {
    const u = String(url || "").trim();
    if (type === "simulated") return "";
    if (!u) return "Informe a URL da fonte.";
    if (/\s/.test(u)) return "A URL não pode conter espaços.";
    if (type === "websocket") {
      if (/^wss:\/\/.+/i.test(u) || /^ws:\/\/(localhost|127\.0\.0\.1)(:\d+)?(\/|$)/i.test(u)) return "";
      return "Use wss:// (ou ws://localhost para testes locais).";
    }
    if (/^https:\/\/.+/i.test(u) || /^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?(\/|$)/i.test(u)) return "";
    if (!/^[a-z][a-z0-9+.-]*:/i.test(u) && !u.startsWith("//")) return "";
    return "Use https://, um caminho relativo (ex.: dados.json) ou http://localhost para testes.";
  }

  function resolve(obj, path) {
    const p = String(path || "").trim();
    if (!p) return obj;
    return p.replace(/\[(\d+)\]/g, ".$1").split(".").filter(Boolean)
      .reduce((o, k) => (o === null || o === undefined ? undefined : o[k]), obj);
  }

  function paths(obj, prefix = "", out = [], depth = 0) {
    if (out.length >= 300 || depth > 6 || obj === null || typeof obj !== "object") return out;
    Object.keys(obj).forEach(k => {
      if (out.length >= 300) return;
      const p = prefix ? `${prefix}.${k}` : k;
      const v = obj[k];
      out.push(p);
      if (v && typeof v === "object" && !Array.isArray(v)) paths(v, p, out, depth + 1);
    });
    return out;
  }

  function interval(s) { return U.clamp(Math.round(U.num(s.interval, 5)), 1, 3600) * 1000; }
  function staleMs(s) {
    const custom = U.num(s.staleAfter, 0);
    if (custom > 0) return custom * 1000;
    if (s.type === "websocket") return 30000;
    return Math.max(15000, interval(s) * 3);
  }

  /* ---------- estado de execução ---------- */
  function rt(id) {
    return runtime[id] || (runtime[id] = { status: "idle", lastOk: 0, lastError: "", latency: null, count: 0, payload: undefined, gen: 0, retry: 0 });
  }
  function emit(id, kind) { listeners.forEach(fn => { try { fn(id, kind); } catch (e) { console.error(e); } }); }
  function setStatus(id, status, error = "") {
    const r = rt(id);
    r.status = status;
    r.lastError = error;
    emit(id, "status");
  }
  function onData(id, payload, latency) {
    const r = rt(id);
    r.payload = payload;
    r.lastOk = Date.now();
    r.status = "online";
    r.lastError = "";
    r.count++;
    if (latency !== null && latency !== undefined) r.latency = latency;
    emit(id, "data");
  }

  /* ---------- simulador ---------- */
  function hhmm(d = new Date()) { return d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }); }
  function makeSim() {
    const drift = (v, pct, min, max) => U.clamp(v + (Math.random() - 0.5) * 2 * Math.max(Math.abs(v) * pct, 0.1), min, max);
    let prod = [420, 445, 438, 470, 462, 490, 505, 498, 512, 530, 524, 541];
    let disp = 98.7, ef = 92.4, cap = 76;
    const integ = [["SCADA", "online"], ["CFTV", "online"], ["Sensores IoT", "online"], ["ERP", "pendente"], ["MES", "offline"]];
    const mes = { volume: 182.4, custo: 18.6 };
    const uni = { "Unidade A": 64, "Unidade B": 51, "Unidade C": 39, "Unidade D": 28 };
    const par = { Recebimento: 34, Secagem: 52, Armazenagem: 18, "Expedição": 41, Utilidades: 12 };
    const pool = [
      ["critical", "Sensor TS-04 sem comunicação"], ["warning", "Temperatura acima da faixa — Silo 03"],
      ["info", "Integração ERP aguardando validação"], ["warning", "Pressão baixa — Linha 02"],
      ["critical", "Parada não programada — Elevador 01"], ["warning", "Umidade elevada — Secador 02"],
      ["info", "Troca de turno registrada"], ["warning", "Fila de caminhões acima do limite"]
    ];
    let alarms = pool.slice(0, 5).map((a, i) => ({ nivel: a[0], descricao: a[1], hora: hhmm(new Date(Date.now() - (i + 1) * 17 * 60000)) }));
    return () => {
      disp = +drift(disp, 0.003, 90, 100).toFixed(1);
      ef = +drift(ef, 0.005, 80, 100).toFixed(1);
      cap = Math.round(drift(cap, 0.03, 40, 98));
      prod = prod.slice(1).concat(Math.max(0, Math.round(drift(prod[prod.length - 1], 0.03, 300, 700))));
      Object.keys(par).forEach(k => (par[k] = Math.max(0, Math.round(drift(par[k], 0.06, 0, 120)))));
      mes.volume = +(mes.volume + Math.random() * 0.05).toFixed(1);
      mes.custo = +drift(mes.custo, 0.004, 15, 22).toFixed(1);
      Object.keys(uni).forEach(k => (uni[k] = Math.round(drift(uni[k], 0.01, 10, 90))));
      if (Math.random() < 0.18) {
        const a = pool[Math.floor(Math.random() * pool.length)];
        alarms.unshift({ nivel: a[0], descricao: a[1], hora: hhmm() });
        alarms = alarms.slice(0, 6);
      } else if (Math.random() < 0.08 && alarms.length > 2) alarms.pop();
      if (Math.random() < 0.05) {
        const i = 3 + Math.floor(Math.random() * 2);
        integ[i][1] = integ[i][1] === "online" ? "pendente" : "online";
      }
      return {
        timestamp: new Date().toISOString(),
        operacao: {
          disponibilidade: disp,
          eficiencia: ef,
          capacidade: cap,
          producaoAtual: prod[prod.length - 1],
          producao: prod.slice(),
          alarmesAtivos: alarms.length,
          sistemasIntegrados: integ.filter(x => x[1] === "online").length
        },
        alarmes: alarms.slice(),
        integracoes: integ.map(([sistema, status]) => ({ sistema, status })),
        paradas: Object.entries(par).map(([area, minutos]) => ({ area, minutos })),
        mes: { volume: mes.volume, custoTonelada: mes.custo, incidentesSeguranca: 0 },
        unidades: Object.entries(uni).map(([unidade, volume]) => ({ unidade, volume }))
      };
    };
  }

  /* ---------- conectores ---------- */
  async function fetchJson(url) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), TIMEOUT);
    const t0 = performance.now();
    try {
      const res = await fetch(url, { cache: "no-store", signal: ctrl.signal, headers: { Accept: "application/json" } });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const text = await res.text();
      let data;
      try { data = JSON.parse(text); } catch (e) { throw new Error("A resposta não é um JSON válido"); }
      return { data, latency: Math.round(performance.now() - t0) };
    } catch (e) {
      if (e.name === "AbortError") throw new Error(`Tempo esgotado (${TIMEOUT / 1000} s)`);
      if (e instanceof TypeError) throw new Error("Falha de conexão (verifique URL, CORS ou se a página está em file://)");
      throw e;
    } finally { clearTimeout(timer); }
  }

  async function poll(s, gen) {
    const r = rt(s.id);
    if (r.inflight) return;
    r.inflight = true;
    try {
      const { data, latency } = await fetchJson(s.url);
      if (r.gen === gen) onData(s.id, data, latency);
    } catch (e) {
      if (r.gen === gen) setStatus(s.id, "error", e.message);
    } finally { r.inflight = false; }
  }

  function openSocket(s, gen) {
    const r = rt(s.id);
    if (r.gen !== gen) return;
    setStatus(s.id, "connecting");
    let ws;
    try { ws = new WebSocket(s.url); }
    catch (e) { setStatus(s.id, "error", "URL de WebSocket inválida"); return; }
    r.ws = ws;
    ws.onopen = () => { if (r.gen === gen) { r.retry = 0; setStatus(s.id, "connecting", ""); } };
    ws.onmessage = ev => {
      if (r.gen !== gen) return;
      try { onData(s.id, JSON.parse(ev.data), null); }
      catch (e) { setStatus(s.id, "error", "Mensagem recebida não é JSON válido"); }
    };
    ws.onclose = () => {
      if (r.gen !== gen || r.ws !== ws) return;
      r.ws = null;
      const delay = Math.min(30000, 1000 * 2 ** Math.min(r.retry++, 5));
      setStatus(s.id, "error", `Conexão encerrada — nova tentativa em ${Math.round(delay / 1000)} s`);
      r.timer = setTimeout(() => openSocket(s, gen), delay);
    };
  }

  function stop(id) {
    const r = runtime[id];
    if (!r) return;
    r.gen++;
    clearInterval(r.timer);
    clearTimeout(r.timer);
    r.timer = null;
    r.inflight = false;
    if (r.ws) { const ws = r.ws; r.ws = null; try { ws.close(); } catch (e) { /* noop */ } }
  }

  function start(s) {
    const r = rt(s.id);
    const gen = r.gen;
    if (!s.enabled) { setStatus(s.id, "disabled"); return; }
    if (s.type === "simulated") {
      if (paused) { setStatus(s.id, "paused"); return; }
      if (!sims[s.id]) sims[s.id] = makeSim();
      const run = () => { if (r.gen === gen) onData(s.id, sims[s.id](), 0); };
      run();
      r.timer = setInterval(run, interval(s));
      return;
    }
    const err = urlCheck(s.url, s.type);
    if (err) { setStatus(s.id, "error", err); return; }
    if (s.type === "rest") {
      setStatus(s.id, "connecting");
      poll(s, gen);
      r.timer = setInterval(() => poll(s, gen), interval(s));
      return;
    }
    if (s.type === "websocket") openSocket(s, gen);
  }

  /* ---------- API pública ---------- */
  function configure(list, opts = {}) {
    paused = opts.simulate === false;
    const ids = new Set(list.map(s => s.id));
    Object.keys(runtime).forEach(id => {
      if (!ids.has(id)) { stop(id); delete runtime[id]; delete sims[id]; }
    });
    list.forEach(s => {
      const r = rt(s.id);
      const sig = JSON.stringify([s.type, s.url, s.interval, s.enabled, s.type === "simulated" && paused]);
      if (r.sig === sig) return;
      r.sig = sig;
      stop(s.id);
      start(s);
    });
  }

  function refresh(s) {
    const r = runtime[s.id];
    if (r) r.sig = null;
  }

  async function test(s) {
    const err = urlCheck(s.url, s.type);
    if (err) return { ok: false, error: err };
    if (s.type === "simulated") return { ok: true, latency: 0, payload: makeSim()() };
    if (s.type === "rest") {
      try { const { data, latency } = await fetchJson(s.url); return { ok: true, latency, payload: data }; }
      catch (e) { return { ok: false, error: e.message }; }
    }
    return new Promise(resolveTest => {
      const t0 = performance.now();
      let ws, done = false;
      const finish = result => { if (done) return; done = true; clearTimeout(timer); try { ws && ws.close(); } catch (e) { /* noop */ } resolveTest(result); };
      const timer = setTimeout(() => finish({ ok: false, error: `Nenhuma mensagem recebida em ${TIMEOUT / 1000} s` }), TIMEOUT);
      try { ws = new WebSocket(s.url); } catch (e) { finish({ ok: false, error: "URL de WebSocket inválida" }); return; }
      ws.onmessage = ev => {
        try { finish({ ok: true, latency: Math.round(performance.now() - t0), payload: JSON.parse(ev.data) }); }
        catch (e) { finish({ ok: false, error: "Mensagem recebida não é JSON válido" }); }
      };
      ws.onerror = () => finish({ ok: false, error: "Falha ao conectar no WebSocket" });
    });
  }

  function status(id) {
    const r = runtime[id];
    return r ? { status: r.status, lastOk: r.lastOk, lastError: r.lastError, latency: r.latency, count: r.count } :
      { status: "idle", lastOk: 0, lastError: "", latency: null, count: 0 };
  }

  function fresh(s) {
    const r = runtime[s.id];
    return !!r && s.enabled && r.lastOk > 0 && Date.now() - r.lastOk <= staleMs(s);
  }

  return {
    TYPES, configure, refresh, test, status, fresh, staleMs, urlCheck, resolve, paths,
    payload: id => (runtime[id] ? runtime[id].payload : undefined),
    on: fn => listeners.add(fn)
  };
})();

const LEVELS = {
  critical: { label: "Crítico", cls: "bad" },
  warning:  { label: "Atenção", cls: "warn" },
  info:     { label: "Info",    cls: "info" }
};
const STATES = {
  online:   { label: "Online",   cls: "good" },
  pendente: { label: "Pendente", cls: "warn" },
  offline:  { label: "Offline",  cls: "bad" }
};

function jitter(value, pct, min = -Infinity, max = Infinity) {
  const step = Math.max(Math.abs(value) * pct, 0.1);
  return U.clamp(value + (Math.random() - 0.5) * 2 * step, min, max);
}

const WIDGETS = {
  kpi: {
    label: "KPI", icon: "◆", description: "Indicador com meta e status",
    defaults: { w: 3, h: 2, title: "Novo indicador", props: { value: 100, unit: "%", decimals: 1, target: 95, direction: "higher", note: "", simulate: false } },
    fields: [
      { key: "value", label: "Valor", type: "number" },
      { key: "unit", label: "Unidade", type: "text" },
      { key: "decimals", label: "Casas decimais", type: "number", min: 0, max: 3 },
      { key: "target", label: "Meta", type: "number" },
      { key: "direction", label: "Melhor quando", type: "select", options: [["higher", "Maior que a meta"], ["lower", "Menor que a meta"]] },
      { key: "note", label: "Observação", type: "text" },
      { key: "simulate", label: "Simular variação", type: "checkbox" }
    ],
    render(w) {
      const p = w.props, d = U.clamp(Math.round(U.num(p.decimals, 1)), 0, 3);
      const v = U.num(p.value), t = U.num(p.target, NaN);
      let tone = "neutral", meta = "";
      if (Number.isFinite(t)) {
        const ok = p.direction === "lower" ? v <= t : v >= t;
        tone = ok ? "good" : "bad";
        meta = `<span class="chip ${tone}">${ok ? "▲" : "▼"} Meta ${U.esc(U.fmt(t, d))}${U.esc(p.unit)}</span>`;
      }
      return `<div class="kpi">
        <div class="kpi-value ${tone}">${U.esc(U.fmt(v, d))}<span class="unit">${U.esc(p.unit)}</span></div>
        <div class="kpi-meta">${meta}<span class="muted">${U.esc(p.note)}</span></div>
      </div>`;
    },
    tick(w) {
      if (!w.props.simulate) return;
      const d = U.clamp(Math.round(U.num(w.props.decimals, 1)), 0, 3);
      const max = String(w.props.unit).trim() === "%" ? 100 : Infinity;
      w.props.value = +jitter(U.num(w.props.value), 0.004, 0, max).toFixed(d);
    }
  },

  line: {
    label: "Gráfico de linha", icon: "∿", description: "Tendência com linha de meta",
    defaults: { w: 6, h: 4, title: "Tendência", props: { series: "10,14,12,18,16,21,24", unit: "", target: "", simulate: false } },
    fields: [
      { key: "series", label: "Valores (separados por vírgula)", type: "textarea" },
      { key: "unit", label: "Unidade", type: "text" },
      { key: "target", label: "Meta (opcional)", type: "number" },
      { key: "simulate", label: "Simular novos pontos", type: "checkbox" }
    ],
    render(w) {
      const vals = U.list(w.props.series);
      if (vals.length < 2) return `<div class="empty">Informe ao menos 2 valores.</div>`;
      const target = U.num(w.props.target, NaN);
      const all = Number.isFinite(target) ? vals.concat(target) : vals;
      let min = Math.min(...all), max = Math.max(...all);
      if (min === max) { min -= 1; max += 1; }
      const pad = (max - min) * 0.12; min -= pad; max += pad;
      const W = 300, H = 100;
      const x = i => (i / (vals.length - 1)) * W;
      const y = v => H - ((v - min) / (max - min)) * H;
      const pts = vals.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
      const gid = "g" + w.id.replace(/[^a-z0-9]/gi, "");
      const last = vals[vals.length - 1], prev = vals[vals.length - 2];
      const delta = prev ? ((last - prev) / Math.abs(prev)) * 100 : 0;
      const targetLine = Number.isFinite(target)
        ? `<line x1="0" x2="${W}" y1="${y(target).toFixed(1)}" y2="${y(target).toFixed(1)}" class="target-line" vector-effect="non-scaling-stroke"/>` : "";
      return `<div class="chart">
        <div class="chart-head">
          <strong>${U.esc(U.fmt(last, 0))}<span class="unit"> ${U.esc(w.props.unit)}</span></strong>
          <span class="chip ${delta >= 0 ? "good" : "bad"}">${delta >= 0 ? "▲" : "▼"} ${U.esc(U.fmt(Math.abs(delta), 1))}%</span>
          ${Number.isFinite(target) ? `<span class="muted legend-target">— meta ${U.esc(U.fmt(target, 0))}</span>` : ""}
        </div>
        <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" class="line-svg" role="img" aria-label="${U.esc(w.title)}">
          <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="var(--accent)" stop-opacity=".35"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/>
          </linearGradient></defs>
          <polygon points="0,${H} ${pts} ${W},${H}" fill="url(#${gid})"/>
          ${targetLine}
          <polyline points="${pts}" class="line-path" vector-effect="non-scaling-stroke"/>
        </svg>
      </div>`;
    },
    tick(w) {
      if (!w.props.simulate) return;
      const vals = U.list(w.props.series);
      if (vals.length < 2) return;
      const next = Math.max(0, Math.round(jitter(vals[vals.length - 1], 0.03)));
      vals.push(next);
      if (vals.length > 24) vals.shift();
      w.props.series = vals.join(",");
    }
  },

    label: "Gráfico de barras", icon: "▥", description: "Comparação entre categorias",

/* ============================================================
 * Vínculo com fontes de dados (v0.3)
 * ------------------------------------------------------------
 * bind.label   : propriedade atualizada pela fonte
 * bind.accepts : formatos aceitos (exibido no editor)
 * bind.apply   : converte o valor recebido e atualiza o widget;
 *                retorna false quando o formato é incompatível
 * ============================================================ */
const Bind = {
  number(v) {
    if (v && typeof v === "object" && !Array.isArray(v)) v = Bind.pick(v, ["value", "valor", "atual"]);
    const n = typeof v === "number" ? v : U.num(v, NaN);
    return Number.isFinite(n) ? n : null;
  },
  pick(o, keys) {
    for (const k of keys) if (o[k] !== undefined && o[k] !== null && o[k] !== "") return o[k];
    return undefined;
  },
  firstString(o) { return Object.values(o).find(x => typeof x === "string"); },
  firstNumber(o) { return Object.values(o).find(x => typeof x === "number" && Number.isFinite(x)); },
  clean(v) { return String(v ?? "").replace(/[|\r\n]+/g, " ").trim(); },
  norm(v) { return String(v ?? "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim(); },
  time(v) {
    if (v === undefined || v === null) return "";
    const s = String(v);
    if (/^\d{4}-\d{2}-\d{2}T/.test(s)) {
      const d = new Date(s);
      if (!isNaN(d)) return d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
    }
    return Bind.clean(s);
  },
  level(v) {
    const s = Bind.norm(v);
    if (/^(crit|alta|high|alarm|grave|emerg)/.test(s)) return "critical";
    if (/^(warn|aten|media|medium|alert|aviso)/.test(s)) return "warning";
    return "info";
  },
  state(v) {
    if (v === true) return "online";
    if (v === false) return "offline";
    const s = Bind.norm(v);
    if (/^(online|ok|up|ativo|conectado|integrado|normal|running)/.test(s)) return "online";
    if (/^(offline|down|erro|error|falha|fail|inativo|desconectado|parado|stopped)/.test(s)) return "offline";
    return "pendente";
  }
};

WIDGETS.kpi.bind = {
  label: "Valor", accepts: "número",
  apply(w, v) { const n = Bind.number(v); if (n === null) return false; w.props.value = n; }
};
WIDGETS.gauge.bind = {
  label: "Valor", accepts: "número",
  apply(w, v) { const n = Bind.number(v); if (n === null) return false; w.props.value = n; }
};
WIDGETS.line.bind = {
  label: "Série de valores", accepts: "lista de números (substitui a série) ou número (adiciona um ponto)",
  apply(w, v) {
    if (v && typeof v === "object" && !Array.isArray(v)) v = Bind.pick(v, ["series", "serie", "valores", "values", "value", "valor"]);
    if (Array.isArray(v)) {
      const nums = v.map(x => (typeof x === "object" && x !== null ? Bind.number(x) : U.num(x, NaN))).filter(n => Number.isFinite(n));
      if (nums.length < 2) return false;
      w.props.series = nums.slice(-48).join(",");
      return;
    }
    const n = Bind.number(v);
    if (n === null) return false;
    const vals = U.list(w.props.series).concat(n).slice(-24);
    w.props.series = vals.join(",");
  }
};
WIDGETS.bar.bind = {
  label: "Categorias e valores", accepts: "lista de objetos (rótulo + número), objeto {categoria: número} ou lista de números",
  apply(w, v) {
    let labels = [], vals = [];
    if (Array.isArray(v)) {
      if (v.every(x => typeof x === "number")) { vals = v; labels = U.labels(w.props.labels); }
      else v.forEach(x => {
        if (!x || typeof x !== "object") return;
        const l = Bind.pick(x, ["label", "rotulo", "nome", "name", "categoria"]) ?? Bind.firstString(x);
        const n = Bind.pick(x, ["value", "valor"]) ?? Bind.firstNumber(x);
        if (l !== undefined && Number.isFinite(U.num(n, NaN))) { labels.push(Bind.clean(l).replace(/,/g, " ")); vals.push(U.num(n)); }
      });
    } else if (v && typeof v === "object") {
      Object.entries(v).forEach(([k, n]) => { if (Number.isFinite(U.num(n, NaN))) { labels.push(Bind.clean(k).replace(/,/g, " ")); vals.push(U.num(n)); } });
    }
    if (!vals.length) return false;
    w.props.labels = labels.join(",");
    w.props.series = vals.join(",");
  }
};
WIDGETS.alarms.bind = {
  label: "Lista de alarmes", accepts: "lista de objetos {nivel, descricao, hora} ou texto no formato nível|descrição|hora",
  apply(w, v) {
    if (typeof v === "string") { w.props.items = v; return; }
    if (!Array.isArray(v)) return false;
    w.props.items = v.slice(0, 50).map(a => {
      if (typeof a === "string") return `info|${Bind.clean(a)}|`;
      if (!a || typeof a !== "object") return "";
      const lvl = Bind.level(Bind.pick(a, ["level", "nivel", "severity", "severidade", "prioridade", "priority"]));
      const text = Bind.clean(Bind.pick(a, ["text", "descricao", "description", "message", "mensagem", "nome"]) ?? Bind.firstString(a));
      const time = Bind.time(Bind.pick(a, ["time", "hora", "timestamp", "data"]));
      return `${lvl}|${text}|${time}`;
    }).filter(Boolean).join("\n");
  }
};
WIDGETS.status.bind = {
  label: "Lista de sistemas", accepts: "lista de objetos {sistema, status} ou objeto {sistema: status}",
  apply(w, v) {
    let rows = [];
    if (Array.isArray(v)) rows = v.filter(x => x && typeof x === "object").map(x => [
      Bind.pick(x, ["name", "nome", "sistema", "system", "label"]) ?? Bind.firstString(x),
      Bind.pick(x, ["status", "estado", "state", "online"])
    ]);
    else if (v && typeof v === "object") rows = Object.entries(v);
    else return false;
    if (!rows.length) return false;
    w.props.items = rows.map(([n, s]) => `${Bind.clean(n)}|${Bind.state(s)}`).join("\n");
  }
};
WIDGETS.table.bind = {
  label: "Linhas da tabela", accepts: "lista de objetos (as chaves viram colunas) ou lista de listas",
  apply(w, v) {
    if (typeof v === "string") { w.props.rows = v; return; }
    if (!Array.isArray(v) || !v.length) return false;
    let rows;
    if (Array.isArray(v[0])) rows = v.map(r => r.map(Bind.clean));
    else if (v[0] && typeof v[0] === "object") {
      const head = Object.keys(v[0]);
      rows = [head].concat(v.slice(0, 200).map(r => head.map(k => Bind.clean(r && r[k]))));
    } else return false;
    w.props.rows = rows.map(r => r.join("|")).join("\n");
  }
};
WIDGETS.text.bind = {
  label: "Conteúdo", accepts: "texto ou número",
  apply(w, v) { if (v === null || typeof v === "object") return false; w.props.content = String(v); }
};
