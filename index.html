  { key: "protocol", label: "Protocolo / interface", type: "text" },
  { key: "status", label: "Status", type: "select", options: Object.keys(ARCH_STATUS), tones: ARCH_STATUS }
];
const ASSET_COLUMNS = [
  { key: "item", label: "Item", type: "text" },
  { key: "qty", label: "Qtd.", type: "number" },
  { key: "location", label: "Local", type: "text" },
  { key: "status", label: "Status", type: "select", options: Object.keys(ASSET_STATUS), tones: ASSET_STATUS },
  { key: "notes", label: "Observações", type: "text" }
];

const Views = {
  widget(w, pageId, editing) {
    const def = WIDGETS[w.type];
    if (!def) return "";
    const size = w.w <= 4 ? "s" : w.w <= 8 ? "m" : "l";
    const tools = editing ? `<div class="w-tools">
        <button type="button" data-action="w-edit" title="Configurar" aria-label="Configurar widget">⚙</button>
        <button type="button" data-action="w-dup" title="Duplicar" aria-label="Duplicar widget">⧉</button>
        <button type="button" data-action="w-del" title="Excluir" aria-label="Excluir widget">✕</button>
      </div>` : "";
    return `<article class="widget t-${w.type} size-${size}" data-id="${U.esc(w.id)}" data-page="${U.esc(pageId)}"
        style="--w:${w.w};--h:${w.h}" ${editing ? 'draggable="true"' : ""}>
      <header class="w-head">
        ${editing ? '<span class="drag-handle" aria-hidden="true">⠿</span>' : ""}
        <h3>${U.esc(w.title)}</h3>
        ${w.binding && w.binding.source ? '<span class="w-src wait" title="Aguardando dados"><span class="t">Aguardando</span></span>' : ""}${tools}
      </header>
      <div class="w-body">${def.render(w)}</div>
      ${editing ? '<span class="resize-handle" data-action="w-resize" title="Arraste para redimensionar"></span>' : ""}
    </article>`;
  },

  grid(page, editing) {
    return `<div class="grid" data-grid="${U.esc(page.id)}">${page.widgets.map(w => Views.widget(w, page.id, editing)).join("")}</div>`;
  },

  dashboard(state, ui) {
    const page = state.pages.find(p => p.id === state.activePage) || state.pages[0];
    const tabs = state.pages.map(p =>
      `<button type="button" class="tab ${p.id === page.id ? "active" : ""}" data-action="page-go" data-page="${U.esc(p.id)}">${U.esc(p.name)}</button>`
    ).join("");
    const editbar = ui.editing ? `<div class="editbar">
        <button type="button" class="btn primary" data-action="lib-open">＋ Adicionar widget</button>
        <button type="button" class="btn" data-action="page-add">＋ Nova página</button>
        <button type="button" class="btn" data-action="page-rename">Renomear página</button>
        <button type="button" class="btn danger" data-action="page-del" ${state.pages.length < 2 ? "disabled" : ""}>Excluir página</button>
        <span class="hint">Arraste os cards para reordenar e use o canto inferior direito para redimensionar.</span>
      </div>` : "";
    const body = page.widgets.length ? Views.grid(page, ui.editing) : `<div class="empty-page">
        <strong>Esta página ainda não possui widgets.</strong>
        <p class="muted">Ative o modo de edição e adicione KPIs, gráficos, alarmes, câmeras ou painéis externos.</p>
        <button type="button" class="btn primary" data-action="${ui.editing ? "lib-open" : "edit-on"}">${ui.editing ? "＋ Adicionar widget" : "✎ Editar COI"}</button>
      </div>`;
    return `<div class="tabs" role="tablist">${tabs}</div>${editbar}${body}`;
  },

  sourceName(state, source) {
    const [kind, a, b] = String(source || "").split(":");
    const page = state.pages.find(p => p.id === a);
    if (kind === "page" && page) return "Página · " + page.name;
    if (kind === "widget" && page) { const w = page.widgets.find(x => x.id === b); if (w) return w.title; }
    return "Sem sinal";
  },

  tileContent(state, source) {
    const [kind, a, b] = String(source || "").split(":");
    const page = state.pages.find(p => p.id === a);
    if (kind === "page" && page) return `<div class="stage stage-page">${Views.grid(page, false)}</div>`;
    if (kind === "widget" && page) {
      const w = page.widgets.find(x => x.id === b);
      if (w) return `<div class="stage stage-widget">${Views.widget(w, page.id, false)}</div>`;
    }
    return `<div class="no-signal"><span>SEM SINAL</span></div>`;
  },

  videowall(state, ui) {
    const vw = state.videowall, total = vw.rows * vw.cols;
    const opts = (sel) => {
      let html = `<option value="none" ${sel === "none" ? "selected" : ""}>Sem sinal</option><optgroup label="Páginas completas">`;
      html += state.pages.map(p => `<option value="page:${U.esc(p.id)}" ${sel === "page:" + p.id ? "selected" : ""}>${U.esc(p.name)}</option>`).join("") + `</optgroup>`;
      state.pages.forEach(p => {
        if (!p.widgets.length) return;
        html += `<optgroup label="Widgets · ${U.esc(p.name)}">` + p.widgets.map(w => {
          const v = `widget:${p.id}:${w.id}`;
          return `<option value="${U.esc(v)}" ${sel === v ? "selected" : ""}>${U.esc(w.title)}</option>`;
        }).join("") + `</optgroup>`;
      });
      return html;
    };
    const num = (n, max, key) => Array.from({ length: max }, (_, i) =>
      `<option value="${i + 1}" ${n === i + 1 ? "selected" : ""}>${i + 1}</option>`).join("");
    let tiles = "";
    for (let i = 0; i < total; i++) {
      const src = (vw.tiles[i] || {}).source || "none";
      tiles += `<div class="tile">
        ${vw.labels ? `<div class="tile-label"><b>TV ${String(i + 1).padStart(2, "0")}</b> ${U.esc(Views.sourceName(state, src))}</div>` : ""}
        <div class="tile-screen">${Views.tileContent(state, src)}</div>
        <label class="tile-select"><span class="sr-only">Fonte da TV ${i + 1}</span>
          <select data-action="tile-src" data-index="${i}">${opts(src)}</select></label>
      </div>`;
    }
    return `<section class="card wall-controls">
        <div class="field-inline"><label>Linhas <select data-action="wall-rows">${num(vw.rows, 4)}</select></label>
        <label>Colunas <select data-action="wall-cols">${num(vw.cols, 6)}</select></label>
        <label class="check"><input type="checkbox" data-action="wall-labels" ${vw.labels ? "checked" : ""}> Identificar telas</label></div>
        <div class="wall-meta muted">${total} telas · proporção 16:9 por tela</div>
        <button type="button" class="btn primary" data-action="wall-tv">▶ Modo TV</button>
      </section>
      <section class="wall-frame"><div class="wall ${vw.labels ? "labeled" : ""}" id="wall" style="--cols:${vw.cols};--rows:${vw.rows}">${tiles}</div></section>`;
  },

  editableTable(coll, rows, cols, editing) {
    const head = cols.map(c => `<th>${U.esc(c.label)}</th>`).join("") + (editing ? "<th></th>" : "");
    const body = rows.map((r, i) => `<tr>${cols.map(c => {
      const v = r[c.key] ?? "";
      if (!editing) {
        if (c.tones) return `<td><span class="chip ${c.tones[v] || ""}">${U.esc(v)}</span></td>`;
        return `<td>${U.esc(v)}</td>`;
      }
      const attrs = `data-action="cell" data-coll="${coll}" data-row="${i}" data-key="${c.key}" aria-label="${U.esc(c.label)}"`;
      if (c.type === "select") {
        const options = c.options.includes(v) ? c.options : [v, ...c.options];
        return `<td><select ${attrs}>${options.map(o => `<option ${o === v ? "selected" : ""}>${U.esc(o)}</option>`).join("")}</select></td>`;
      }
      return `<td><input ${attrs} type="${c.type === "number" ? "number" : "text"}" ${c.type === "number" ? 'min="0"' : ""} value="${U.esc(v)}"></td>`;
    }).join("")}${editing ? `<td><button type="button" class="icon-btn sm" data-action="row-del" data-coll="${coll}" data-row="${i}" aria-label="Excluir linha">✕</button></td>` : ""}</tr>`).join("");
    return `<div class="table-wrap card"><table class="data-table"><thead><tr>${head}</tr></thead><tbody>${body ||
      `<tr><td colspan="${cols.length + 1}" class="muted">Nenhum registro.</td></tr>`}</tbody></table>
      ${editing ? `<div class="table-foot"><button type="button" class="btn" data-action="row-add" data-coll="${coll}">＋ Adicionar linha</button></div>` :
      `<div class="table-foot muted">Ative “Editar COI” para alterar esta tabela.</div>`}</div>`;
  },

  summary(items) {
    return `<div class="summary">${items.map(i =>
      `<div class="card stat"><span class="muted">${U.esc(i.label)}</span><strong class="${i.tone || ""}">${U.esc(i.value)}</strong></div>`).join("")}</div>`;
  },

  arquitetura(state, ui) {
    const rows = state.architecture;
    const count = s => rows.filter(r => r.status === s).length;
    const layers = ARCH_COLUMNS[0].options.filter(l => rows.some(r => r.layer === l))
      .concat([...new Set(rows.map(r => r.layer))].filter(l => !ARCH_COLUMNS[0].options.includes(l)));
    const diagram = layers.map(l => `<div class="layer"><span class="layer-name">${U.esc(l)}</span><div class="layer-items">${
      rows.filter(r => r.layer === l).map(r => `<span class="node ${ARCH_STATUS[r.status] || ""}" title="${U.esc(r.protocol)}">${U.esc(r.system)}</span>`).join("")}</div></div>`).join("");
    return Views.summary([
      { label: "Sistemas mapeados", value: rows.length },
      { label: "Integrados", value: count("Integrado"), tone: "good" },
      { label: "Em andamento", value: count("Em andamento"), tone: "warn" },
      { label: "Pendentes", value: count("Pendente"), tone: "bad" }
    ]) + `<section class="card"><div class="section-head"><h2>Mapa de integração por camada</h2>
        <span class="legend"><i class="dot good"></i>Integrado <i class="dot warn"></i>Em andamento <i class="dot bad"></i>Pendente</span></div>
        <div class="layers">${diagram || '<p class="muted">Nenhum sistema cadastrado.</p>'}</div></section>
      <h2 class="block-title">Inventário de sistemas</h2>` + Views.editableTable("architecture", rows, ARCH_COLUMNS, ui.editing);
  },

  infraestrutura(state, ui) {
    const rows = state.assets;
    const qty = rows.reduce((s, r) => s + Math.max(0, U.num(r.qty)), 0);
    const inst = rows.filter(r => r.status === "Instalado").length;
    return Views.summary([
      { label: "Itens cadastrados", value: rows.length },
      { label: "Quantidade total", value: qty },
      { label: "Instalados", value: inst, tone: "good" },
      { label: "A instalar", value: rows.length - inst, tone: "warn" }
    ]) + `<h2 class="block-title">Infraestrutura física do COI</h2>` + Views.editableTable("assets", rows, ASSET_COLUMNS, ui.editing);
  },

  boundWidgets(state, sourceId) {
    const out = [];
    state.pages.forEach(p => p.widgets.forEach(w => {
      if (w.binding && w.binding.source === sourceId) out.push({ page: p, widget: w });
    }));
    return out;
  },

  srcState(s) {
    const r = DataHub.status(s.id);
    if (!s.enabled || r.status === "disabled") return { cls: "muted", label: "Desativada" };
    if (r.status === "paused") return { cls: "muted", label: "Pausada" };
    if (DataHub.fresh(s)) return { cls: "good", label: "Online" };
    if (r.status === "error") return { cls: "bad", label: "Erro" };
    if (r.lastOk) return { cls: "warn", label: "Sem atualização" };
    return { cls: "info", label: "Conectando" };
  },

  srcSummary(state) {
    const srcs = state.sources;
    const states = srcs.map(s => Views.srcState(s).cls);
    const bound = state.pages.reduce((n, p) => n + p.widgets.filter(w => w.binding && w.binding.source).length, 0);
    return Views.summary([
      { label: "Fontes cadastradas", value: srcs.length },
      { label: "Online", value: states.filter(c => c === "good").length, tone: "good" },
      { label: "Com erro ou sem atualização", value: states.filter(c => c === "bad" || c === "warn").length, tone: "bad" },
      { label: "Widgets vinculados", value: bound }
    ]);
  },

  srcLive(s) {
    const r = DataHub.status(s.id), st = Views.srcState(s);
    const last = r.lastOk ? "há " + U.ago(Date.now() - r.lastOk) : "—";
    return `<div class="src-status"><span class="chip ${st.cls}"><i class="dot ${st.cls}"></i>${st.label}</span></div>
      <dl class="src-meta">
        <div><dt>Última atualização</dt><dd>${U.esc(last)}</dd></div>
        <div><dt>Leituras</dt><dd>${U.esc(U.fmt(r.count, 0))}</dd></div>
        <div><dt>Latência</dt><dd>${r.latency === null ? "—" : U.esc(r.latency) + " ms"}</dd></div>
        <div><dt>Considera desatualizado após</dt><dd>${U.esc(U.ago(DataHub.staleMs(s)))}</dd></div>
      </dl>
      ${r.lastError ? `<p class="src-error">${U.esc(r.lastError)}</p>` : ""}`;
  },

  dados(state) {
    const cards = state.sources.map(s => {
      const T = DataHub.TYPES[s.type];
      const bound = Views.boundWidgets(state, s.id);
      const where = s.type === "simulated" ? "Gerado no navegador" : s.url;
      return `<article class="card src-card" data-src="${U.esc(s.id)}">
        <div class="src-top">
          <span class="lib-ico" aria-hidden="true">${T.icon}</span>
          <div class="src-name"><strong>${U.esc(s.name)}</strong><small title="${U.esc(where)}">${U.esc(T.label)} · ${U.esc(where)}</small></div>
          <label class="switch" title="Ativar ou desativar a fonte">
            <input type="checkbox" data-action="src-toggle" data-src="${U.esc(s.id)}" ${s.enabled ? "checked" : ""}>
            <span class="sr-only">Fonte ativa</span><span class="switch-ui" aria-hidden="true"></span>
          </label>
        </div>
        <div class="src-live" data-live="${U.esc(s.id)}">${Views.srcLive(s)}</div>
        <div class="src-bound">
          <span class="muted">${bound.length} widget${bound.length === 1 ? "" : "s"} vinculado${bound.length === 1 ? "" : "s"}</span>
          ${bound.slice(0, 6).map(b => `<span class="chip">${U.esc(b.widget.title)}</span>`).join("")}
          ${bound.length > 6 ? `<span class="chip">+${bound.length - 6}</span>` : ""}
        </div>
        <div class="btn-row">
          <button type="button" class="btn" data-action="src-view" data-src="${U.esc(s.id)}">Ver dados</button>
          <button type="button" class="btn" data-action="src-test" data-src="${U.esc(s.id)}">Testar</button>
          <button type="button" class="btn" data-action="src-edit" data-src="${U.esc(s.id)}">Editar</button>
          <button type="button" class="btn danger" data-action="src-del" data-src="${U.esc(s.id)}">Excluir</button>
        </div>
      </article>`;
    }).join("");
    return `<div id="srcSummary">${Views.srcSummary(state)}</div>
      <div class="section-head block-head"><h2>Fontes cadastradas</h2>
        <button type="button" class="btn primary" data-action="src-add">＋ Nova fonte</button></div>
      ${cards ? `<div class="src-grid">${cards}</div>` : `<div class="empty-page"><strong>Nenhuma fonte cadastrada.</strong>
        <p class="muted">Cadastre uma API REST, um WebSocket ou o simulador para alimentar os widgets.</p>
        <button type="button" class="btn primary" data-action="src-add">＋ Nova fonte</button></div>`}
      <section class="card how">
        <h2>Como vincular um widget</h2>
        <ol>
          <li>Cadastre a fonte e use <strong>Ver dados</strong> para conferir os caminhos disponíveis no JSON.</li>
          <li>Ative <strong>Editar COI</strong>, abra a configuração (⚙) do widget e escolha a fonte e o caminho (ex.: <code>operacao.disponibilidade</code>).</li>
          <li>O widget passa a exibir <span class="w-src good static"><span class="t">Ao vivo</span></span> ou <span class="w-src warn static"><span class="t">Desatualizado</span></span> conforme o tempo desde a última leitura.</li>
        </ol>
        <p class="muted">Para testar localmente com REST e WebSocket: <code>node coi-tools.mjs servidor</code>. Detalhes na seção <strong>Integração</strong> do README.</p>
      </section>`;
  },

  configuracoes(state) {
    const s = state.settings;
    return `<div class="settings">
      <section class="card"><h2>Identidade</h2>
        <label class="field">Nome da plataforma<input type="text" data-setting="name" maxlength="40" value="${U.esc(s.name)}"></label>
        <label class="field">Subtítulo<input type="text" data-setting="subtitle" maxlength="60" value="${U.esc(s.subtitle)}"></label>
        <label class="field">Cor de destaque<input type="color" data-setting="accent" value="${U.esc(s.accent)}"></label>
        <label class="field">Tema<select data-setting="theme">
          ${[["dark", "Escuro"], ["light", "Claro"], ["auto", "Automático (sistema)"]].map(([v, l]) => `<option value="${v}" ${s.theme === v ? "selected" : ""}>${l}</option>`).join("")}
        </select></label>
      </section>
      <section class="card"><h2>Dados</h2>
        <label class="check"><input type="checkbox" data-setting="simulate" ${s.simulate ? "checked" : ""}> Simular dados em tempo real</label>
        <label class="field">Intervalo de atualização (segundos)<input type="number" min="2" max="60" data-setting="refresh" value="${U.esc(s.refresh)}"></label>
        <p class="muted">Pausar a simulação interrompe os widgets com “Simular” ativo e as fontes do tipo Simulador. Fontes REST e WebSocket continuam ativas — gerencie-as em <strong>Fontes de dados</strong>.</p>
      </section>
      <section class="card"><h2>Configuração</h2>
        <p class="muted">Todas as alterações ficam salvas neste navegador. Exporte o JSON para versionar no repositório ou compartilhar com a equipe.</p>
        <div class="btn-row">
          <button type="button" class="btn primary" data-action="export">⇩ Exportar JSON</button>
          <button type="button" class="btn" data-action="import">⇧ Importar JSON</button>
          <button type="button" class="btn danger" data-action="reset">Restaurar padrão</button>
        </div>
      </section>
    </div>`;
  }
};

/* ==========================================================
   App — estado, eventos, editor, videowall e dados ao vivo
   ========================================================== */
(() => {
  "use strict";

  const $ = (s, root = document) => root.querySelector(s);
  const $$ = (s, root = document) => [...root.querySelectorAll(s)];

  let state = Store.load();
  const ui = { view: "dashboard", editing: false, drawer: null };
  let simTimer = null, dragId = null, saveTimer = null;

  const VIEW_META = {
    dashboard:      { title: () => currentPage().name, sub: "Monitoramento operacional consolidado" },
    videowall:      { title: () => "Videowall", sub: "Distribuição de conteúdos por tela" },
    dados:          { title: () => "Fontes de dados", sub: "Conectores REST, WebSocket e simulador, com status de atualização" },
    arquitetura:    { title: () => "Arquitetura de integração", sub: "Sistemas, camadas, protocolos e status" },
    infraestrutura: { title: () => "Infraestrutura", sub: "Equipamentos e ativos físicos do COI" },
    configuracoes:  { title: () => "Configurações", sub: "Identidade, dados e versionamento da configuração" }
  };

  /* ---------- helpers ---------- */
  function currentPage() {
    return state.pages.find(p => p.id === state.activePage) || state.pages[0];
  }
  function findWidget(pageId, id) {
    const page = state.pages.find(p => p.id === pageId);
    return page ? { page, widget: page.widgets.find(w => w.id === id), index: page.widgets.findIndex(w => w.id === id) } : {};
  }
  function save(immediate) {
    clearTimeout(saveTimer);
    if (immediate) Store.save(state);
    else saveTimer = setTimeout(() => Store.save(state), 250);
  }
  function toast(msg, tone = "") {
    const t = $("#toast");
    t.textContent = msg;
    t.className = "toast show " + tone;
    clearTimeout(t._timer);
    t._timer = setTimeout(() => (t.className = "toast"), 2600);
  }
  function slug(text) {
    return String(text).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 24) || "pagina";
  }

  /* ---------- dados ao vivo (v0.3) ---------- */
  const live = new Map();
  const liveKey = (pageId, id) => pageId + "::" + id;

  function applyToWidget(pageId, w, payload) {
    const def = WIDGETS[w.type];
    const key = liveKey(pageId, w.id);
    if (!def || !def.bind || payload === undefined) return false;
    const value = DataHub.resolve(payload, w.binding.path);
    const prev = live.get(key) || {};
    if (value === undefined) { live.set(key, { at: prev.at, error: "Caminho não encontrado" }); return false; }
    let ok = false;
    try { ok = def.bind.apply(w, value) !== false; } catch (e) { ok = false; }
    live.set(key, ok ? { at: Date.now() } : { at: prev.at, error: "Formato incompatível" });
    return ok;
  }

  function refreshBodies(pageId, w) {
    const def = WIDGETS[w.type];
    $$(`.widget[data-page="${CSS.escape(pageId)}"][data-id="${CSS.escape(w.id)}"] .w-body`)
      .forEach(body => (body.innerHTML = def.render(w)));
  }

  function onSourceData(sourceId) {
    const payload = DataHub.payload(sourceId);
    state.pages.forEach(page => page.widgets.forEach(w => {
      if (!w.binding || w.binding.source !== sourceId) return;
      if (applyToWidget(page.id, w, payload)) refreshBodies(page.id, w);
    }));
  }

  const el_w = w => w.w <= 4;

  function widgetLive(pageId, w) {
    const src = state.sources.find(s => s.id === w.binding.source);
    if (!src) return { cls: "bad", text: "Fonte removida", title: "A fonte vinculada não existe mais" };
    if (!src.enabled) return { cls: "muted", text: "Fonte desativada", title: src.name };
    const l = live.get(liveKey(pageId, w.id));
    const r = DataHub.status(src.id);
    if (l && l.error) return { cls: "bad", text: l.error, title: `${src.name} · caminho “${w.binding.path || "(raiz)"}”` };
    if (!l || !l.at) {
      if (r.status === "error") return { cls: "bad", text: "Sem conexão", title: `${src.name}: ${r.lastError}` };
      if (r.status === "paused") return { cls: "muted", text: "Pausada", title: `${src.name} pausada` };
      return { cls: "wait", text: "Aguardando", title: `Aguardando a primeira leitura de ${src.name}` };
    }
    const age = Date.now() - l.at;
    const title = `${src.name} · atualizado há ${U.ago(age)}${r.lastError ? " · " + r.lastError : ""}`;
    if (age > DataHub.staleMs(src)) return { cls: "warn", text: el_w(w) ? "Desatualizado" : "Desatualizado há " + U.ago(age), title: "Desatualizado · " + title, stale: true };
    return { cls: "good", text: "Ao vivo", title };
  }

  function updateLive() {
    $$(".widget .w-src").forEach(badge => {
      const el = badge.closest(".widget");
      const { widget: w } = findWidget(el.dataset.page, el.dataset.id);
      if (!w || !w.binding) return;
      const st = widgetLive(el.dataset.page, w);
      badge.className = "w-src " + st.cls;
      badge.title = st.title;
      badge.firstElementChild.textContent = st.text;
      el.classList.toggle("is-stale", !!st.stale);
    });
    updateSourcePill();
    if (ui.view === "dados") {
      const sum = $("#srcSummary");
      if (sum) sum.innerHTML = Views.srcSummary(state);
      $$("[data-live]").forEach(box => {
        const src = state.sources.find(s => s.id === box.dataset.live);
        if (src) box.innerHTML = Views.srcLive(src);
      });
    }
  }

  function updateSourcePill() {
    const pill = $("#srcPill");
    const active = state.sources.filter(s => s.enabled);
    const ok = active.filter(s => DataHub.fresh(s)).length;
    const cls = !active.length ? "muted" : ok === active.length ? "good" : ok ? "warn" : "bad";
    pill.querySelector(".dot").className = "dot " + cls;
    pill.querySelector(".t").textContent = active.length ? `${ok}/${active.length} fontes online` : "Sem fontes ativas";
    pill.title = active.length ? `${ok} de ${active.length} fontes ativas com dados atualizados` : "Nenhuma fonte de dados ativa";
  }

  /* ---------- tema e identidade ---------- */
  function applyTheme() {
    const s = state.settings;
    const theme = s.theme === "auto" ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light") : s.theme;
    document.documentElement.dataset.theme = theme;
    if (/^#[0-9a-f]{6}$/i.test(s.accent)) document.documentElement.style.setProperty("--accent", s.accent);
    $("#brandName").textContent = s.name || "COI Forge";
    $("#brandSub").textContent = s.subtitle || "";
    document.title = (s.name || "COI Forge") + " · " + VIEW_META[ui.view].title();
    $("#liveToggle").setAttribute("aria-pressed", String(!!s.simulate));
    $("#liveToggle").classList.toggle("off", !s.simulate);
    $("#liveLabel").textContent = s.simulate ? "Simulação ativa" : "Simulação pausada";
  }

  /* ---------- render ---------- */
  function render() {
    applyTheme();
    document.body.classList.toggle("editing", ui.editing);
    $("#editBtn").textContent = ui.editing ? "✓ Concluir edição" : "✎ Editar COI";
    $("#editBtn").setAttribute("aria-pressed", String(ui.editing));
    $$("#nav [data-view]").forEach(b => b.classList.toggle("active", b.dataset.view === ui.view));
    $("#pageList").innerHTML = state.pages.map(p =>
      `<button type="button" data-action="page-go" data-page="${U.esc(p.id)}" class="${ui.view === "dashboard" && p.id === state.activePage ? "active" : ""}">
        <span class="ico">›</span>${U.esc(p.name)}<small>${p.widgets.length}</small></button>`).join("");
    const meta = VIEW_META[ui.view];
    $("#viewTitle").textContent = meta.title();
    $("#viewSub").textContent = meta.sub;
    $("#view").innerHTML = Views[ui.view](state, ui);
    $("#view").dataset.view = ui.view;
    updateClocks();
    updateLive();
    if (ui.view === "videowall") requestAnimationFrame(fitStages);
  }

  function rerenderWidget(pageId, id) {
    const { widget } = findWidget(pageId, id);
    if (!widget) return;
    $$(`.widget[data-page="${CSS.escape(pageId)}"][data-id="${CSS.escape(id)}"]`).forEach(el => {
      el.outerHTML = Views.widget(widget, pageId, ui.editing && !el.closest(".stage"));
    });
    updateClocks();
    updateLive();
  }

  /* ---------- videowall: escala das telas ---------- */
  function fitStages() {
    $$(".tile-screen").forEach(screen => {
      const stage = screen.querySelector(".stage");
      if (!stage) return;
      stage.style.transform = "none";
      const sw = stage.offsetWidth, sh = stage.offsetHeight;
      if (!sw || !sh) return;
      const s = Math.min(screen.clientWidth / sw, screen.clientHeight / sh);
      const x = (screen.clientWidth - sw * s) / 2, y = (screen.clientHeight - sh * s) / 2;
      stage.style.transform = `translate(${x}px, ${y}px) scale(${s})`;
    });
  }
  let fitFrame = 0;
  new ResizeObserver(() => {
    if (ui.view !== "videowall") return;
    cancelAnimationFrame(fitFrame);
    fitFrame = requestAnimationFrame(fitStages);
  }).observe($("#view"));

  /* ---------- relógios ---------- */
  function fmtTime(tz, opts) {
    try { return new Intl.DateTimeFormat("pt-BR", Object.assign({ timeZone: tz || undefined }, opts)).format(new Date()); }
    catch (e) { return new Intl.DateTimeFormat("pt-BR", opts).format(new Date()); }
  }
  function updateClocks() {
    $("#clock").textContent = fmtTime(null, { weekday: "short", day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" });
    $$("[data-clock]").forEach(el => {
      const tz = el.dataset.clock;
      if (el.dataset.format === "cam") {
        el.textContent = fmtTime(tz, { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit", second: "2-digit" });
        return;
      }
      const t = el.querySelector(".clock-time"), d = el.querySelector(".clock-date");
      if (t) t.textContent = fmtTime(tz, { hour: "2-digit", minute: "2-digit", second: "2-digit" });
      if (d) d.textContent = fmtTime(tz, { weekday: "long", day: "2-digit", month: "long" }) + " · " + (tz || "");
    });
  }
  setInterval(() => { updateClocks(); updateLive(); }, 1000);

  /* ---------- simulação ---------- */
  function tick() {
    if (!state.settings.simulate || ui.editing || document.hidden) return;
    state.pages.forEach(page => page.widgets.forEach(w => {
      const def = WIDGETS[w.type];
      if (!def || !def.tick || (w.binding && w.binding.source)) return;
      const before = JSON.stringify(w.props);
      def.tick(w);
      if (JSON.stringify(w.props) === before) return;
      $$(`.widget[data-page="${CSS.escape(page.id)}"][data-id="${CSS.escape(w.id)}"] .w-body`)
        .forEach(body => (body.innerHTML = def.render(w)));
    }));
  }
  function restartSimulation(resetLive) {
    if (resetLive) live.clear();
    DataHub.configure(state.sources, { simulate: !!state.settings.simulate });
    clearInterval(simTimer);
    const sec = U.clamp(Math.round(U.num(state.settings.refresh, 5)), 2, 60);
    simTimer = setInterval(tick, sec * 1000);
  }

  /* ---------- drawer ---------- */
  function openDrawer(html, mode) {
    const d = $("#drawer");
    d.innerHTML = html;
    d.classList.add("open");
    d.setAttribute("aria-hidden", "false");
    $("#scrim").hidden = false;
    ui.drawer = mode;
    const first = d.querySelector("input, select, textarea, button.lib-item");
    if (first) first.focus();
  }
  function closeDrawer() {
    $("#drawer").classList.remove("open");
    $("#drawer").setAttribute("aria-hidden", "true");
    $("#scrim").hidden = true;
    $("#sidebar").classList.remove("open");
    ui.drawer = null;
  }

  function openLibrary() {
    const items = Object.entries(WIDGETS).map(([type, d]) =>
      `<button type="button" class="lib-item" data-action="lib-add" data-type="${type}">
        <span class="lib-ico">${d.icon}</span><span><strong>${U.esc(d.label)}</strong><small>${U.esc(d.description)}</small></span>
      </button>`).join("");
    openDrawer(`<div class="drawer-head"><div><strong>Biblioteca de widgets</strong><small>Adicionar à página “${U.esc(currentPage().name)}”</small></div>
      <button type="button" class="icon-btn" data-action="drawer-close" aria-label="Fechar">✕</button></div>
      <div class="lib">${items}</div>`, "library");
  }

  function fieldHTML(f, value, attr) {
    const id = "f-" + f.key + "-" + Math.random().toString(36).slice(2, 6);
    if (f.type === "checkbox") return `<label class="check"><input type="checkbox" ${attr} ${value ? "checked" : ""}> ${U.esc(f.label)}</label>`;
    let input;
    if (f.type === "textarea") input = `<textarea id="${id}" rows="${f.rows || 4}" ${attr}>${U.esc(value)}</textarea>`;
    else if (f.type === "select") input = `<select id="${id}" ${attr}>${f.options.map(([v, l]) => `<option value="${U.esc(v)}" ${String(value) === v ? "selected" : ""}>${U.esc(l)}</option>`).join("")}</select>`;
    else input = `<input id="${id}" type="${f.type === "number" ? "number" : "text"}" step="any" ${f.min != null ? `min="${f.min}"` : ""} ${f.max != null ? `max="${f.max}"` : ""} value="${U.esc(value)}" ${attr}>`;
    return `<div class="field"><label for="${id}">${U.esc(f.label)}</label>${input}</div>`;
  }

  function pathOptions(sourceId) {
    const payload = sourceId ? DataHub.payload(sourceId) : undefined;
    return payload === undefined ? "" : DataHub.paths(payload).map(p => `<option value="${U.esc(p)}"></option>`).join("");
  }

  function bindPreview(pageId, w) {
    if (!w.binding || !w.binding.source) return `<span class="muted">Sem vínculo: os valores das propriedades abaixo são exibidos diretamente.</span>`;
    const payload = DataHub.payload(w.binding.source);
    if (payload === undefined) return `<span class="muted">Aguardando a primeira leitura desta fonte.</span>`;
    const v = DataHub.resolve(payload, w.binding.path);
    if (v === undefined) return `<span class="bad">Caminho não encontrado na última leitura.</span>`;
    let txt = JSON.stringify(v);
    if (txt && txt.length > 160) txt = txt.slice(0, 160) + "…";
    const l = live.get(liveKey(pageId, w.id));
    const err = l && l.error ? ` <span class="bad">· ${U.esc(l.error)}</span>` : "";
    return `Valor atual: <code>${U.esc(txt)}</code>${err}<br><span class="muted">As propriedades correspondentes são substituídas pela fonte a cada leitura.</span>`;
  }

  function openEditor(pageId, id) {
    const { widget: w } = findWidget(pageId, id);
    if (!w) return;
    const def = WIDGETS[w.type];
    const base = `
      ${fieldHTML({ key: "title", label: "Título", type: "text" }, w.title, 'data-wfield="title" maxlength="60"')}
      <div class="field-row">
        <div class="field"><label>Largura <output id="outW">${w.w}</output>/12</label><input type="range" min="1" max="12" value="${w.w}" data-wfield="w"></div>
        <div class="field"><label>Altura <output id="outH">${w.h}</output></label><input type="range" min="1" max="8" value="${w.h}" data-wfield="h"></div>
      </div>`;
    const props = def.fields.map(f => fieldHTML(f, w.props[f.key], `data-wprop="${f.key}" data-type="${f.type}"`)).join("");
    const b = w.binding || {};
    const bind = def.bind ? `<hr><div class="group-title">Fonte de dados</div>
      <div class="field"><label for="bSrc">Fonte</label><select id="bSrc" data-bind="source">
        <option value="">Nenhuma — valores manuais${def.tick ? " ou simulados" : ""}</option>
        ${state.sources.map(s => `<option value="${U.esc(s.id)}" ${b.source === s.id ? "selected" : ""}>${U.esc(s.name)}${s.enabled ? "" : " (desativada)"}</option>`).join("")}
      </select></div>
      <div class="field" id="bPathWrap" ${b.source ? "" : "hidden"}><label for="bPath">Caminho no JSON</label>
        <input id="bPath" type="text" data-bind="path" list="bPaths" autocomplete="off" placeholder="ex.: operacao.disponibilidade" value="${U.esc(b.path || "")}">
        <datalist id="bPaths">${pathOptions(b.source)}</datalist>
        <small class="muted hint-text">Atualiza: <strong>${U.esc(def.bind.label)}</strong>. Aceita ${U.esc(def.bind.accepts)}.</small>
      </div>
      <div class="bind-preview" id="bPreview">${bindPreview(pageId, w)}</div>` : "";
    openDrawer(`<div class="drawer-head"><div><strong>Configurar widget</strong><small>${def.icon} ${U.esc(def.label)}</small></div>
        <button type="button" class="icon-btn" data-action="drawer-close" aria-label="Fechar">✕</button></div>
      <form class="drawer-form" data-page="${U.esc(pageId)}" data-id="${U.esc(id)}" novalidate>${base}${bind}<hr><div class="group-title">Propriedades</div>${props}</form>
      <div class="drawer-foot">
        <button type="button" class="btn danger" data-action="w-del" data-page="${U.esc(pageId)}" data-id="${U.esc(id)}">Excluir</button>
        <button type="button" class="btn primary" data-action="drawer-close">Concluir</button>
      </div>`, "editor");
  }

  function onEditorInput(target) {
    const form = target.closest(".drawer-form");
    if (!form) return;
    const { widget: w } = findWidget(form.dataset.page, form.dataset.id);
    if (!w) return;
    if (target.dataset.bind) {
      const src = $("#bSrc").value, path = $("#bPath").value.trim().slice(0, 200);
      const key = liveKey(form.dataset.page, w.id);
      live.delete(key);
      if (src) w.binding = { source: src, path }; else delete w.binding;
      $("#bPathWrap").hidden = !src;
      if (target.dataset.bind === "source") $("#bPaths").innerHTML = pathOptions(src);
      if (src) applyToWidget(form.dataset.page, w, DataHub.payload(src));
      $("#bPreview").innerHTML = bindPreview(form.dataset.page, w);
      save();
      rerenderWidget(form.dataset.page, form.dataset.id);
      return;
    }
    if (target.dataset.wfield === "title") w.title = target.value.slice(0, 60);
    else if (target.dataset.wfield === "w") { w.w = U.clamp(Math.round(U.num(target.value, 3)), 1, 12); $("#outW").textContent = w.w; }
    else if (target.dataset.wfield === "h") { w.h = U.clamp(Math.round(U.num(target.value, 2)), 1, 8); $("#outH").textContent = w.h; }
    else if (target.dataset.wprop) {
      const k = target.dataset.wprop, t = target.dataset.type;
      if (t === "checkbox") w.props[k] = target.checked;
      else if (t === "number") w.props[k] = target.value === "" ? "" : U.num(target.value, 0);
      else w.props[k] = target.value;
    }
    save();
    rerenderWidget(form.dataset.page, form.dataset.id);
  }

  /* ---------- fontes de dados: editor ---------- */
  function openSourceEditor(id) {
    const s = id ? state.sources.find(x => x.id === id) : { id: "", name: "", type: "rest", url: "", interval: 10, staleAfter: 0, enabled: true };
    if (!s) return;
    const typeOpts = Object.entries(DataHub.TYPES).map(([k, t]) => `<option value="${k}" ${s.type === k ? "selected" : ""}>${U.esc(t.label)}</option>`).join("");
    openDrawer(`<div class="drawer-head"><div><strong>${id ? "Editar fonte" : "Nova fonte de dados"}</strong><small>Conector REST, WebSocket ou simulador</small></div>
        <button type="button" class="icon-btn" data-action="drawer-close" aria-label="Fechar">✕</button></div>
      <form class="drawer-form src-form" id="srcForm" data-id="${U.esc(s.id)}" novalidate>
        <div class="field"><label for="sName">Nome</label><input id="sName" name="name" type="text" maxlength="40" required value="${U.esc(s.name)}" placeholder="ex.: API SCADA — Unidade A"></div>
        <div class="field"><label for="sType">Tipo</label><select id="sType" name="type">${typeOpts}</select></div>
        <div class="field" id="sUrlWrap"><label for="sUrl">URL</label><input id="sUrl" name="url" type="text" maxlength="500" value="${U.esc(s.url)}" autocomplete="off">
          <small class="muted hint-text" id="sUrlHint"></small></div>
        <div class="field-row">
          <div class="field" id="sIntWrap"><label for="sInt">Intervalo (s)</label><input id="sInt" name="interval" type="number" min="1" max="3600" step="1" value="${U.esc(s.interval)}"></div>
          <div class="field"><label for="sStale">Desatualizado após (s)</label><input id="sStale" name="staleAfter" type="number" min="0" max="86400" step="1" value="${U.esc(s.staleAfter)}">
            <small class="muted hint-text">0 = automático</small></div>
        </div>
        <label class="check"><input type="checkbox" id="sEnabled" ${s.enabled ? "checked" : ""}> Fonte ativa</label>
        <p class="muted hint-text">Não informe tokens ou senhas na URL: a configuração fica no navegador e pode ser exportada. Para APIs autenticadas, utilize um proxy (ver seção <strong>Integração</strong> do README).</p>
        <p class="form-msg" id="srcMsg" role="status" aria-live="polite"></p>
        <button type="submit" hidden></button>
      </form>
      <div class="drawer-foot">
        <button type="button" class="btn" data-action="src-form-test">Testar conexão</button>
        <button type="button" class="btn primary" id="srcSave">Salvar fonte</button>
      </div>`, "source");
    syncSourceForm();
  }

  function syncSourceForm() {
    const type = $("#sType").value;
    $("#sUrlWrap").hidden = type === "simulated";
    $("#sIntWrap").hidden = type === "websocket";
    $("#sUrl").placeholder = type === "websocket" ? "wss://servidor/coi/stream" : "https://servidor/api/coi ou dados.json";
    $("#sUrlHint").textContent = type === "websocket"
      ? "Cada mensagem recebida deve ser um JSON. Reconexão automática em caso de queda."
      : "A URL é consultada a cada intervalo e deve responder JSON (com CORS liberado quando estiver em outro domínio).";
    $("#srcMsg").textContent = "";
  }

  function readSourceForm() {
    const f = $("#srcForm");
    const raw = {
      id: f.dataset.id || U.uid("src"),
      name: $("#sName").value.trim(),
      type: $("#sType").value,
      url: $("#sUrl").value.trim(),
      interval: $("#sInt").value,
      staleAfter: $("#sStale").value,
      enabled: $("#sEnabled").checked
    };
    if (!raw.name) return { error: "Informe o nome da fonte." };
    if (raw.type === "simulated") raw.url = "";
    const err = DataHub.urlCheck(raw.url, raw.type);
    if (err) return { error: err };
    return { source: Store.source(raw) };
  }

  function saveSourceForm() {
    const data = readSourceForm();
    if (data.error) { const m = $("#srcMsg"); m.className = "form-msg bad"; m.textContent = data.error; return; }
    const src = data.source;
    const i = state.sources.findIndex(s => s.id === src.id);
    if (i >= 0) state.sources[i] = src; else state.sources.push(src);
    DataHub.refresh(src);
    save(true); restartSimulation(); closeDrawer(); render();
    toast(`Fonte “${src.name}” ${i >= 0 ? "atualizada" : "cadastrada"}.`, "good");
  }

  function openSourceData(id) {
    const src = state.sources.find(s => s.id === id);
    if (!src) return;
    const payload = DataHub.payload(id);
    let body;
    if (payload === undefined) body = `<p class="muted">Nenhum dado recebido ainda. Verifique o status da fonte ou use “Testar”.</p>`;
    else {
      const rows = DataHub.paths(payload).slice(0, 120).map(p => {
        const v = DataHub.resolve(payload, p);
        let txt = Array.isArray(v) ? `lista (${v.length})` : v && typeof v === "object" ? "objeto" : JSON.stringify(v);
        if (txt && txt.length > 48) txt = txt.slice(0, 48) + "…";
        return `<tr><td><code>${U.esc(p)}</code></td><td>${U.esc(txt)}</td></tr>`;
      }).join("");
      let json = JSON.stringify(payload, null, 2);
      if (json.length > 20000) json = json.slice(0, 20000) + "\n…";
      body = `<div class="group-title">Caminhos disponíveis</div>
        <div class="table-wrap paths"><table><thead><tr><th>Caminho</th><th>Valor</th></tr></thead><tbody>${rows}</tbody></table></div>
        <div class="group-title">Última leitura (JSON)</div><pre class="json">${U.esc(json)}</pre>`;
    }
    openDrawer(`<div class="drawer-head"><div><strong>${U.esc(src.name)}</strong><small>Dados recebidos da fonte</small></div>
        <button type="button" class="icon-btn" data-action="drawer-close" aria-label="Fechar">✕</button></div>
      <div class="drawer-form">${body}</div>`, "data");
  }

  /* ---------- ações ---------- */
  function setView(view) {
    if (!Views[view]) return;
    ui.view = view;
    closeDrawer();
    render();
    $("#view").focus({ preventScroll: true });
    window.scrollTo(0, 0);
  }

  function toggleEditing(force) {
    ui.editing = typeof force === "boolean" ? force : !ui.editing;
    if (!ui.editing) { closeDrawer(); save(true); toast("Alterações salvas neste navegador."); }
    render();
  }

  const actions = {
    "edit-on": () => toggleEditing(true),
    "page-go": el => { state.activePage = el.dataset.page; save(); setView("dashboard"); },
    "page-add": () => {
      const name = (prompt("Nome da nova página:", "Nova página") || "").trim().slice(0, 30);
      if (!name) return;
      const id = slug(name) + "-" + Math.random().toString(36).slice(2, 5);
      state.pages.push({ id, name, widgets: [] });
      state.activePage = id;
      save(true); render(); toast(`Página “${name}” criada.`);
    },
    "page-rename": () => {
      const page = currentPage();
      const name = (prompt("Novo nome da página:", page.name) || "").trim().slice(0, 30);
      if (!name) return;
      page.name = name; save(true); render();
    },
    "page-del": () => {
      if (state.pages.length < 2) return;
      const page = currentPage();
      if (!confirm(`Excluir a página “${page.name}” e seus ${page.widgets.length} widgets?`)) return;
      state.pages = state.pages.filter(p => p !== page);
      state.activePage = state.pages[0].id;
      save(true); render(); toast("Página excluída.");
    },
    "lib-open": openLibrary,
    "lib-add": el => {
      const def = WIDGETS[el.dataset.type];
      if (!def) return;
      const page = currentPage();
      const d = U.clone(def.defaults);
      const w = { id: U.uid(el.dataset.type), type: el.dataset.type, title: d.title, w: d.w, h: d.h, props: d.props };
      page.widgets.push(w);
      save(true); render();
      openEditor(page.id, w.id);
      const node = $(`.widget[data-id="${CSS.escape(w.id)}"]`);
      if (node) node.scrollIntoView({ behavior: "smooth", block: "center" });
    },
    "w-edit": el => { const c = el.closest(".widget"); openEditor(c.dataset.page, c.dataset.id); },
    "w-dup": el => {
      const c = el.closest(".widget");
      const { page, widget, index } = findWidget(c.dataset.page, c.dataset.id);
      if (!widget) return;
      const copy = U.clone(widget);
      copy.id = U.uid(widget.type); copy.title = widget.title + " (cópia)";
      page.widgets.splice(index + 1, 0, copy);
      save(true); render(); toast("Widget duplicado.");
    },
    "w-del": el => {
      const c = el.closest(".widget") || el;
      const { page, widget } = findWidget(c.dataset.page, c.dataset.id);
      if (!widget || !confirm(`Excluir o widget “${widget.title}”?`)) return;
      page.widgets = page.widgets.filter(w => w !== widget);
      closeDrawer(); save(true); render(); toast("Widget excluído.");
    },
    "drawer-close": closeDrawer,
    "src-add": () => openSourceEditor(null),
    "src-edit": el => openSourceEditor(el.dataset.src),
    "src-view": el => openSourceData(el.dataset.src),
    "src-test": async el => {
      const src = state.sources.find(s => s.id === el.dataset.src);
      if (!src) return;
      el.disabled = true; el.textContent = "Testando…";
      const r = await DataHub.test(src);
      el.disabled = false; el.textContent = "Testar";
      if (r.ok) toast(`${src.name}: conexão OK (${r.latency} ms, ${DataHub.paths(r.payload).length} campos).`, "good");
      else toast(`${src.name}: ${r.error}`, "bad");
    },
    "src-del": el => {
      const src = state.sources.find(s => s.id === el.dataset.src);
      if (!src) return;
      const bound = Views.boundWidgets(state, src.id);
      const msg = bound.length ? `Excluir a fonte “${src.name}”? ${bound.length} widget(s) serão desvinculados e manterão os últimos valores.` : `Excluir a fonte “${src.name}”?`;
      if (!confirm(msg)) return;
      bound.forEach(b => { delete b.widget.binding; live.delete(liveKey(b.page.id, b.widget.id)); });
      state.sources = state.sources.filter(s => s !== src);
      save(true); restartSimulation(); render(); toast("Fonte excluída.");
    },
    "src-form-test": async el => {
      const data = readSourceForm();
      const out = $("#srcMsg");
      if (data.error) { out.className = "form-msg bad"; out.textContent = data.error; return; }
      el.disabled = true; out.className = "form-msg"; out.textContent = "Testando conexão…";
      const r = await DataHub.test(data.source);
      el.disabled = false;
      if (r.ok) { out.className = "form-msg good"; out.textContent = `Conexão OK · ${r.latency} ms · ${DataHub.paths(r.payload).length} campos encontrados.`; }
      else { out.className = "form-msg bad"; out.textContent = r.error; }
    },
    "wall-tv": () => {
      const frame = $(".wall-frame");
      if (frame && frame.requestFullscreen) frame.requestFullscreen().catch(() => toast("Tela cheia indisponível neste navegador.", "bad"));
    },
    "row-add": el => {
      const coll = el.dataset.coll;
      const blank = coll === "architecture"
        ? { layer: "Campo", system: "Novo sistema", vendor: "", protocol: "", status: "Pendente" }
        : { item: "Novo item", qty: 1, location: "", status: "Planejado", notes: "" };
      state[coll].push(blank); save(true); render();
      const inputs = $$(`[data-coll="${coll}"][data-key="${coll === "architecture" ? "system" : "item"}"]`);
      if (inputs.length) { inputs[inputs.length - 1].focus(); inputs[inputs.length - 1].select(); }
    },
    "row-del": el => {
      state[el.dataset.coll].splice(+el.dataset.row, 1); save(true); render();
    },
    "export": () => {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "coi-forge-config.json";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      toast("Configuração exportada.");
    },
    "import": () => $("#importFile").click(),
    "reset": () => {
      if (!confirm("Restaurar a configuração padrão? As alterações locais serão perdidas.")) return;
      state = Store.reset(); ui.editing = false; restartSimulation(true); render(); toast("Configuração padrão restaurada.");
    }
  };

  document.addEventListener("click", e => {
    const nav = e.target.closest("#nav [data-view]");
    if (nav) { setView(nav.dataset.view); return; }
    const el = e.target.closest("[data-action]");
    if (el && el.tagName !== "SELECT" && el.tagName !== "INPUT" && actions[el.dataset.action]) {
      e.preventDefault();
      actions[el.dataset.action](el);
    }
  });

  document.addEventListener("input", e => {
    const t = e.target;
    if (t.closest("#srcForm")) { syncSourceForm(); return; }
    if (t.closest("#drawer")) return onEditorInput(t);
    if (t.dataset.action === "cell") {
      const row = state[t.dataset.coll][+t.dataset.row];
      if (row) { row[t.dataset.key] = t.type === "number" ? Math.max(0, U.num(t.value, 0)) : t.value; save(); }
      return;
    }
    if (t.dataset.setting) {
      const s = state.settings, k = t.dataset.setting;
      if (k === "simulate") s.simulate = t.checked;
      else if (k === "refresh") s.refresh = U.clamp(Math.round(U.num(t.value, 5)), 2, 60);
      else s[k] = t.value;
      applyTheme(); save();
      if (k === "simulate" || k === "refresh") restartSimulation();
    }
  });

  document.addEventListener("change", e => {
    const t = e.target, a = t.dataset.action;
    if (a === "src-toggle") {
      const src = state.sources.find(s => s.id === t.dataset.src);
      if (src) { src.enabled = t.checked; save(true); restartSimulation(); updateLive(); toast(`${src.name} ${src.enabled ? "ativada" : "desativada"}.`); }
      return;
    }
    const vw = state.videowall;
    if (a === "cell") { if (t.tagName === "SELECT") render(); return; }
    if (a === "tile-src") { vw.tiles[+t.dataset.index] = { source: t.value }; }
    else if (a === "wall-rows") vw.rows = U.clamp(+t.value, 1, 4);
    else if (a === "wall-cols") vw.cols = U.clamp(+t.value, 1, 6);
    else if (a === "wall-labels") vw.labels = t.checked;
    else if (t.dataset.setting === "refresh") { t.value = state.settings.refresh; return; }
    else return;
    while (vw.tiles.length < vw.rows * vw.cols) vw.tiles.push({ source: "none" });
    save(true); render();
  });

  $("#importFile").addEventListener("change", e => {
    const file = e.target.files[0];
    e.target.value = "";
    if (!file) return;
    if (file.size > 2 * 1024 * 1024) { toast("Arquivo muito grande (máx. 2 MB).", "bad"); return; }
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (!Store.valid(data)) throw new Error("schema");
        state = Store.normalize(data);
        save(true); restartSimulation(true); render(); toast("Configuração importada com sucesso.", "good");
      } catch (err) { toast("Arquivo inválido para o COI Forge.", "bad"); }
    };
    reader.readAsText(file);
  });

  /* ---------- drag-and-drop (reordenar) ---------- */
  document.addEventListener("dragstart", e => {
    const el = e.target.closest && e.target.closest('.widget[draggable="true"]');
    if (!el) return;
    dragId = el.dataset.id;
    el.classList.add("dragging");
    e.dataTransfer.effectAllowed = "move";
    e.dataTransfer.setData("text/plain", dragId);
  });
  document.addEventListener("dragover", e => {
    const t = e.target.closest && e.target.closest(".grid .widget");
    if (!dragId || !t || t.dataset.id === dragId) return;
    e.preventDefault();
    const r = t.getBoundingClientRect();
    const after = e.clientX > r.left + r.width / 2;
    $$(".drop-before, .drop-after").forEach(x => x.classList.remove("drop-before", "drop-after"));
    t.classList.add(after ? "drop-after" : "drop-before");
  });
  document.addEventListener("drop", e => {
    const t = e.target.closest && e.target.closest(".grid .widget");
    if (!dragId || !t) return;
    e.preventDefault();
    const page = currentPage();
    const from = page.widgets.findIndex(w => w.id === dragId);
    if (from < 0) return;
    const [moved] = page.widgets.splice(from, 1);
    let to = page.widgets.findIndex(w => w.id === t.dataset.id);
    if (t.classList.contains("drop-after")) to += 1;
    page.widgets.splice(to, 0, moved);
    save(true); render();
  });
  document.addEventListener("dragend", () => {
    dragId = null;
    $$(".dragging, .drop-before, .drop-after").forEach(x => x.classList.remove("dragging", "drop-before", "drop-after"));
  });

  /* ---------- redimensionamento ---------- */
  document.addEventListener("pointerdown", e => {
    const handle = e.target.closest && e.target.closest(".resize-handle");
    if (!handle) return;
    e.preventDefault();
    const el = handle.closest(".widget"), grid = el.parentElement;
    const { widget: w } = findWidget(el.dataset.page, el.dataset.id);
    if (!w) return;
    const cs = getComputedStyle(grid);
    const gap = parseFloat(cs.columnGap) || 14;
    const colW = (grid.clientWidth - gap * 11) / 12 + gap;
    const rowH = (parseFloat(cs.gridAutoRows) || 88) + (parseFloat(cs.rowGap) || gap);
    const start = { x: e.clientX, y: e.clientY, w: w.w, h: w.h };
    el.draggable = false;
    el.classList.add("resizing");
    handle.setPointerCapture(e.pointerId);
    const move = ev => {
      w.w = U.clamp(Math.round(start.w + (ev.clientX - start.x) / colW), 1, 12);
      w.h = U.clamp(Math.round(start.h + (ev.clientY - start.y) / rowH), 1, 8);
      el.style.setProperty("--w", w.w);
      el.style.setProperty("--h", w.h);
      el.dataset.size = `${w.w} × ${w.h}`;
    };
    const up = () => {
      handle.removeEventListener("pointermove", move);
      handle.removeEventListener("pointerup", up);
      handle.removeEventListener("pointercancel", up);
      save(true);
      rerenderWidget(el.dataset.page, el.dataset.id);
    };
    handle.addEventListener("pointermove", move);
    handle.addEventListener("pointerup", up);
    handle.addEventListener("pointercancel", up);
  });

  document.addEventListener("submit", e => {
    if (e.target.id === "srcForm") { e.preventDefault(); saveSourceForm(); }
  });
  document.addEventListener("click", e => {
    if (e.target.closest("#srcSave")) saveSourceForm();
  });

  /* ---------- topo / atalhos ---------- */
  $("#editBtn").addEventListener("click", () => toggleEditing());
  $("#themeBtn").addEventListener("click", () => {
    state.settings.theme = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
    save(true); render();
  });
  $("#fullBtn").addEventListener("click", () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
  });
  $("#liveToggle").addEventListener("click", () => {
    state.settings.simulate = !state.settings.simulate;
    save(true); restartSimulation(); applyTheme();
    if (ui.view === "configuracoes") render();
  });
  $("#menuBtn").addEventListener("click", () => {
    $("#sidebar").classList.toggle("open");
    $("#scrim").hidden = !$("#sidebar").classList.contains("open");
  });
  $("#scrim").addEventListener("click", closeDrawer);
  $("#srcPill").addEventListener("click", () => setView("dados"));
  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && (ui.drawer || $("#sidebar").classList.contains("open"))) closeDrawer();
  });
  document.addEventListener("fullscreenchange", () => {
    document.body.classList.toggle("presenting", document.fullscreenElement === document.documentElement);
    setTimeout(fitStages, 60);
  });
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => state.settings.theme === "auto" && applyTheme());

  /* ---------- init ---------- */
  DataHub.on((id, kind) => {
    if (kind === "data") onSourceData(id);
    updateLive();
  });
  render();
  restartSimulation();
})();
  </script>
</body>
</html>
